function confirmModal(title, body, okLabel, onOk, kind="red"){
  const root = $("#modal-root");
  root.innerHTML = `<div class="mask" data-action="modal-bg">
    <div class="modal">
      <div class="mh">${title}</div>
      <div class="mb">${body}</div>
      <div class="mf">
        <button class="btn" data-action="modal-cancel">取消</button>
        <button class="btn ${kind}" data-action="modal-ok">${okLabel}</button>
      </div>
    </div></div>`;
  root._ok = onOk;
}
function closeModal(){ $("#modal-root").innerHTML = ""; $("#modal-root")._ok = null; }

/* ---------------------------------------------------------------- *
 * 16. EVENT DELEGATION
 * ---------------------------------------------------------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const A = t.dataset.action;

  switch (A) {
    case "nav": switchView(t.dataset.view); break;

    case "kill":
      if (S.killed){
        confirmModal("重新啟動交易引擎",
          `解除緊急停止,策略將可以重新開倉。<br><br>
           注意:這<b>不會</b>解除風控的自動停止條件。`,
          "重新啟動", () => {
            S.killed = false; S.engine = "IDLE";
            log("WARN","Kill switch released — engine re-armed.");
            toast("<b>引擎已重新啟動。</b>","a"); closeModal(); repaint();
          }, "grn");
      } else {
        confirmModal("⛔ 緊急停止",
          `將立刻<b>以市價平掉全部 ${S.positions.length} 筆持倉</b>、取消所有掛單並停止引擎。<br><br>
           目前未實現盈虧 <b class="${cls(unrealized())}">${sgn(unrealized())}</b> 會即時結算。`,
          "全部停止", () => { engageKill(); closeModal(); repaint(); });
      }
      break;

    case "close-all":
      if (!S.positions.length){ toast("目前沒有持倉。","a"); break; }
      confirmModal("全部平倉",
        `以目前市價平掉全部 <b>${S.positions.length}</b> 筆持倉?<br><br>
         未實現盈虧:<b class="${cls(unrealized())}">${sgn(unrealized())}</b>`,
        "全部平倉", () => {
          const n = S.positions.length;
          [...S.positions].forEach(p => closePosition(p, "MANUAL CLOSE"));
          log("WARN", `Manual flatten — ${n} position(s) closed at market.`);
          closeModal(); repaint();
        });
      break;

    case "close-one": {
      const p = S.positions.find(x=>x.id===t.dataset.id);
      if (p){ closePosition(p, "MANUAL CLOSE"); repaint(); }
      break;
    }

    case "cancel-pending": {
      const n = S.orders.filter(o=>o.status==="PENDING").length;
      S.orders = S.orders.filter(o=>o.status!=="PENDING");
      log("INFO", `Cancelled ${n} pending order(s).`);
      toast(n?`已取消 <b>${n}</b> 筆掛單。`:"沒有待取消的掛單。", n?"a":"b");
      repaint(); break;
    }

    case "reset-breakers":
      confirmModal("解除風控限制",
        `將日虧/週虧基準、連續虧損計數與單日開倉次數全部歸零。<br><br>
         <b>這是手動強制解除。</b>交易手冊的規定是停到下一個交易時段、並先檢討交易紀錄——
         虧了 2% 就解除限制繼續做,正是這道風控要防止的行為。`,
        "仍要解除", () => {
          S.acct.dayAnchor = S.acct.equity;
          S.acct.weekAnchor = S.acct.equity;
          S.breaker = { daily:false, weekly:false, streak:false, cooldownUntil:0, streakCount:0, tradesToday:0 };
          if (!S.killed) S.engine = "IDLE";
          log("WARN","Circuit breakers manually reset by operator.");
          toast("風控限制已解除。","a"); closeModal(); repaint();
        }, "pri");
      break;

    case "strat-toggle": break; // handled on change

    case "env-reload": envLoad(); break;
    case "env-save":   envSave(); break;
    case "env-safe": {
      ENVED.dirty[t.dataset.k] = t.dataset.v;
      ENVED.rev++;
      envSave();
      break;
    }

    case "panic": {
      confirmModal("立即停止實盤",
        `將關閉儀表板下單、停用所有策略,並把後端的 <b>LIVE_TRADING</b> 設為 false。<br><br>
         已開倉的部位<b>不會</b>自動平倉 —— 若要一併平掉,請按主控台的「全部平倉」。`,
        "停止實盤", async () => {
          S.liveOrders = false;
          setAllStrats(false);
          try {
            await fetch(`${BE.url}/api/env`, { method:"POST",
              headers:{"Content-Type":"application/json"},
              body: JSON.stringify({ values:{ LIVE_TRADING:"false" } }) });
          } catch(e){}
          await beHealth();
          log("ERR","操作員按下停止實盤 — 儀表板下單關閉、策略停用、後端已解除武裝。");
          toast("<b>實盤已停止。</b>","r",8000);
          closeModal(); repaint();
        });
      break;
    }

    case "diag-run": diagRun(); break;

    case "cfg-save":   cfgSave(); V.setup.refresh(); break;
    case "cfg-load":   if (cfgLoad(false)) switchView("setup"); break;
    case "cfg-export": cfgExport(); break;
    case "cfg-reset":  cfgReset(); V.setup.refresh(); break;
    case "cfg-import": { const f = $("#cfg-file"); if (f) f.click(); break; }

    case "strat-tf": {
      const sk = t.dataset.s, k = t.dataset.k, tfc = S.strat[sk].tf;
      if (tfc[k] && DUALMA_TFS.filter(x=>tfc[x]).length === 1){
        toast("至少要保留一個週期。","a"); break;
      }
      tfc[k] = !tfc[k];
      log("INFO", `${sk} ${TF[k].label} 週期${tfc[k]?"啟用":"停用"}。`);
      switchView("setup"); break;
    }

    case "turtle-sys": {
      S.strat.turtle.system = S.strat.turtle.system === 1 ? 2 : 1;
      log("INFO", `海龜切換為系統 ${S.strat.turtle.system}。`);
      switchView("setup"); break;
    }

    case "macd-tf": {
      const k = t.dataset.k, tfc = S.strat.macd.tf;
      if (tfc[k] && DUALMA_TFS.filter(x=>tfc[x]).length === 1){
        toast("MACD 至少要保留一個週期。","a"); break;
      }
      tfc[k] = !tfc[k];
      log("INFO", `MACD ${TF[k].label} 週期${tfc[k]?"啟用":"停用"}。`);
      switchView("setup"); break;
    }

    case "dm-tf": {
      const k = t.dataset.k, tfc = S.strat.dualma.tf;
      if (tfc[k] && DUALMA_TFS.filter(x=>tfc[x]).length === 1){
        toast("雙均線至少要保留一個週期。","a"); break;
      }
      tfc[k] = !tfc[k];
      log("INFO", `Dual MA ${TF[k].label} stream ${tfc[k]?"enabled":"disabled"}.`);
      switchView("setup"); break;
    }

    case "alloc": {
      const s = t.dataset.s, a = t.dataset.a;
      S.strat[s].alloc[a] = !S.strat[s].alloc[a];
      log("INFO", `${s.toUpperCase()} allocation ${S.strat[s].alloc[a]?"enabled":"disabled"} for ${a}.`);
      switchView("setup"); break;
    }

    // Choosing strategies is the operator's call. This used to force
    // playbook+dualma on, quietly overwriting whatever had been selected.
    case "start-all":
      switchView("setup");
      toast("在「2 · 策略」選擇要啟用的策略,打開右側開關即可。","a", 7000);
      break;

    case "stop-all":
      setAllStrats(false);
      log("WARN", `策略已全部停用(${STRAT_KEYS.length} 個)— 不再開新倉,既有持倉保留止損止盈。`);
      toast("策略已全部暫停。<br><span style=\"font-size:11.5px\">既有持倉仍會依止損止盈執行。</span>","a");
      repaint(); break;

    case "ex-test": testConnection(t.dataset.x); break;

    case "ex-clear": {
      const x = t.dataset.x;
      S.ex[x] = { on:false, key:"", secret:"", pass:"", lat:null, tier:null, testing:false };
      log("INFO", `${EXNAME[x]} credentials cleared.`);
      switchView("setup"); break;
    }

    case "net": {
      const wantMain = t.dataset.v === "main";
      if (wantMain && S.testnet){
        confirmModal("⚠ 切換到主網",
          `主網會用<b>真實資金以 20× 槓桿</b>下單。<br><br>
           依照交易手冊,實盤前應先完成<b>至少 100 筆手動回測</b>與<b>一整個月的模擬盤紀錄</b>,
           而且只能使用「全部虧光也能承受」的資金。<br><br>
           (此版本為模擬,實際上不會送出任何真實委託。)`,
          "我了解,切換", () => {
            S.testnet = false; log("ERR","SWITCHED TO MAINNET — live capital mode.");
            toast("已切換到<b>主網</b>。","r",7000); closeModal(); switchView("setup");
          });
      } else if (!wantMain) {
        S.testnet = true; log("INFO","Switched to TESTNET.");
        switchView("setup");
      }
      break;
    }

    case "calc-sync": syncCalc(); calcSizing(); break;

    case "bt-src": S.btSrc = t.dataset.v; switchView("backtest"); break;

    case "bt-asset-all":
      RBT.cfg.assets = Object.keys(UNIVERSE); switchView("backtest"); break;
    case "bt-asset-core":
      RBT.cfg.assets = ["BTC","ETH","SOL"]; switchView("backtest"); break;

    case "bt-asset": {
      const a = t.dataset.a, L = RBT.cfg.assets;
      const i = L.indexOf(a);
      if (i >= 0){ if (L.length === 1){ toast("至少要選一個幣種。","a"); break; } L.splice(i,1); }
      else L.push(a);
      switchView("backtest"); break;
    }

    case "bt-strat": {
      const k = t.dataset.k, L = RBT.cfg.strats;
      const i = L.indexOf(k);
      if (i >= 0){ if (L.length === 1){ toast("至少要選一個策略。","a"); break; } L.splice(i,1); }
      else L.push(k);
      switchView("backtest"); break;
    }

    case "bt-run": {
      if (S.btSrc === "real"){
        const y = parseFloat(($("#bt-years")||{}).value);
        const q = parseFloat(($("#bt-eq")||{}).value);
        RBT.cfg.years  = clamp(isFinite(y)?y:4, 0.25, 20);
        RBT.cfg.equity = Math.max(100, isFinite(q)?q:10000);
        startRealBacktest();
        V.backtest.progress();
        break;
      }
      const num = (id,d) => { const v = parseFloat(($("#"+id)||{}).value); return isFinite(v)?v:d; };
      BT.cfg.years   = clamp(Math.round(num("bt-years",10)),1,20);
      BT.cfg.equity  = Math.max(100, num("bt-eq",10000));
      BT.cfg.volScale= clamp(num("bt-vol",1),0.3,3);
      BT.cfg.regime  = ($("#bt-regime")||{}).value || "neutral";
      BT.cfg.seed    = (($("#bt-seed")||{}).value || "").trim();
      BT.cfg.playbook= ($("#bt-pb")||{}).checked;
      BT.cfg.m15     = ($("#bt-m15")||{}).checked;
      BT.cfg.h4      = ($("#bt-h4")||{}).checked;
      BT.cfg.dualma  = BT.cfg.m15 || BT.cfg.h4;
      BT.cfg.breakers= ($("#bt-brk")||{}).checked;
      if (!BT.cfg.playbook && !BT.cfg.dualma){
        toast("請至少啟用一個策略。","r"); break;
      }
      startBacktest();
      V.backtest.progress();
      break;
    }
    case "bt-cancel": BT.cancel = true; RBT.cancel = true; toast("正在取消回測…","a"); break;
    case "bt-export": {
      if (!BT.res) break;
      const head = "closed_bar,asset,exchange,strategy,timeframe,side,entry,exit,qty,notional,margin,sl,tp,pnl,r_multiple,reason,trigger";
      const rows = BT.res.tradeList.map(t=>[t.closed,t.asset,t.ex,t.strat,t.tf,t.side,
        t.entry,t.exit,t.qty,t.notional,t.margin,t.sl,t.tp,t.pnl.toFixed(2),t.r.toFixed(3),
        t.reason,(t.trigger||"").replace(/,/g,";")].join(","));
      const blob = new Blob([head+"\n"+rows.join("\n")],{type:"text/csv"});
      const a2 = document.createElement("a");
      a2.href = URL.createObjectURL(blob);
      a2.download = `backtest-${BT.res.cfg.years}y-seed${BT.res.seed}.csv`;
      a2.click(); URL.revokeObjectURL(a2.href);
      toast(`已匯出 <b>${BT.res.tradeList.length}</b> 筆交易。`,"g"); break;
    }

    case "clear-logs": S.logs = []; log("INFO","Log buffer cleared."); switchView("console"); break;

    case "export-logs": {
      const txt = S.logs.slice().reverse()
        .map(l=>`${new Date(l.t).toISOString()}  [${l.level}]  ${l.msg}`).join("\n");
      const blob = new Blob([txt], {type:"text/plain"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `quant-terminal-log-${Date.now()}.txt`;
      a.click(); URL.revokeObjectURL(a.href);
      toast("訊息已匯出。","g"); break;
    }

    case "modal-ok": { const f = $("#modal-root")._ok; if (f) f(); break; }
    case "modal-cancel": closeModal(); break;
    case "modal-bg": if (e.target.classList.contains("mask")) closeModal(); break;
  }
});

document.addEventListener("change", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const A = t.dataset.action;

  if (A === "strat-toggle"){
    const s = t.dataset.s;
    S.strat[s].on = t.checked;
    log(t.checked?"WARN":"INFO",
        `${s==="playbook"?"7-Step Playbook":"Dual MA System"} ${t.checked?"ARMED":"disarmed"}.`);
    repaint();
  }
  if (A === "ex-toggle"){
    const x = t.dataset.x, e2 = S.ex[x];
    if (t.checked){
      if (!e2.key || !e2.secret || (x==="bitget" && !e2.pass)){
        t.checked = false;
        toast(`<b>${EXNAME[x]}</b><br>請先填入 API Key、Secret${x==="bitget"?" 與 Passphrase":""}。`,"r");
        return;
      }
      if (e2.lat === null){ t.checked = false; toast("請先按<b>測試</b>確認連線。","a"); return; }
      e2.on = true; log("INFO", `${EXNAME[x]} connected · ${e2.lat} ms · ${e2.tier} · ${S.testnet?"TESTNET":"MAINNET"}`);
      toast(`<b>${EXNAME[x]}</b> 已連線。`,"g");
    } else {
      e2.on = false; log("WARN", `${EXNAME[x]} disconnected.`);
    }
    repaint();
  }
  if (A === "ma"){
    const f = t.dataset.f;
    let v = parseFloat(t.value);
    if (!isFinite(v)) return;
    if (f==="fast") v = clamp(Math.round(v),2,60);
    if (f==="slow") v = clamp(Math.round(v),5,200);
    if (f==="adxMin") v = clamp(v,0,60);
    if (f==="volMult") v = clamp(v,0.5,5);
    S.strat.dualma[f] = v; t.value = v;
    if (S.strat.dualma.fast >= S.strat.dualma.slow){
      toast("Fast EMA must be shorter than slow EMA — auto-corrected.","a");
      S.strat.dualma.slow = S.strat.dualma.fast + 5;
    }
    log("INFO", `Dual MA parameter ${f} → ${v}`);
    computeIndicators(); repaint();
  }
  if (t.id === "cfg-file" && t.files && t.files[0]) cfgImportFile(t.files[0]);
  if (A === "live-orders"){
    S.liveOrders = t.checked;
    log(t.checked?"ERR":"INFO",
        t.checked ? "儀表板下單已啟用 — 條件符合時會送出真實委託。" : "儀表板下單已關閉。");
    if (t.checked) toast("<b>儀表板下單已啟用</b><br><span style=\'font-size:11.5px\'>"
        + "仍需後端 LIVE_TRADING=true 且 DRY_RUN=false 才會真的送出。</span>","r",9000);
    switchView("setup");
  }
  if (A === "live-toggle"){ liveToggle(t.checked); repaint(); }
  if (A === "ma-bool"){ S.strat.dualma[t.dataset.f] = t.checked; repaint(); }
  if (A === "calc"){ if (t.id==="rc-asset") syncCalc(); calcSizing(); }
});

document.addEventListener("input", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  if (t.dataset.action === "ex-field") S.ex[t.dataset.x][t.dataset.f] = t.value.trim();
  if (t.dataset.action === "env-field"){
    // record the edit only; repainting here would yank focus away
    ENVED.dirty[t.dataset.k] = t.value;
    const lbl = t.previousElementSibling;
    if (lbl && !lbl.querySelector(".acc"))
      lbl.insertAdjacentHTML("beforeend", ' <span class="acc">· 已修改</span>');
  }
  if (t.dataset.action === "logfilter") S.logFilter = t.value;
  if (t.dataset.action === "calc") calcSizing();
});

/* ---------------------------------------------------------------- *
 * 17. ACTIONS

function engageKill(){
  const n = S.positions.length;
  [...S.positions].forEach(p => closePosition(p, "KILL SWITCH"));
  S.orders = S.orders.filter(o => o.status !== "PENDING");
  S.killed = true;
  S.engine = "KILLED";
  S.strat.playbook.on = false;
  S.strat.dualma.on = false;
  log("ERR", `KILL SWITCH ENGAGED — ${n} position(s) flattened, strategies disarmed, engine stopped.`);
  toast("<b>已緊急停止</b><br>所有持倉已平倉,引擎已關閉。","r",9000);
}

function testConnection(id){
  const e = S.ex[id];
  if (!e.key || !e.secret || (id==="bitget" && !e.pass)){
    $("#ex-res-"+id).innerHTML = `<span class="chip r">缺少金鑰</span>`;
    toast(`<b>${EXNAME[id]}</b><br>需要 API Key、Secret${id==="bitget"?" 與 Passphrase":""}。`,"r");
    return;
  }
  e.testing = true;
  $("#ex-res-"+id).innerHTML = `<span class="chip a">連線中…</span>`;
  log("INFO", `${EXNAME[id]} — connection test initiated (${S.testnet?"testnet":"mainnet"} endpoint, simulated).`);
  setTimeout(()=>{
    e.testing = false;
    e.lat = 18 + Math.floor(Math.random()*120);
    e.tier = ["VIP 0","VIP 1","VIP 2","Regular"][Math.floor(Math.random()*4)];
    const el = $("#ex-res-"+id);
    if (el) el.innerHTML = `<span class="chip g">正常 · ${e.lat} ms</span>`;
    log("INFO", `${EXNAME[id]} handshake OK — ${e.lat} ms · tier ${e.tier} · isolated 20× confirmed.`);
    toast(`<b>${EXNAME[id]}</b> 連線正常<br>
      <span style="font-family:var(--mono);font-size:11px">${e.lat} ms · ${e.tier} · 請開啟右側開關</span>`,"g");
    repaint();
  }, 550 + Math.random()*700);
}

function syncCalc(){
  const a = $("#rc-asset") ? $("#rc-asset").value : "BTC";
  const k = $("#rc-tf") ? $("#rc-tf").value : "h4";
  const m = S.mkt[a], c = CFG.assets[a];
  const I = m.tf && m.tf[k];
  if ($("#rc-entry")) $("#rc-entry").value = m.last.toFixed(c.dp);
  if ($("#rc-atr"))   $("#rc-atr").value = (I ? I.atr : m.last*0.01).toFixed(c.dp);
  if ($("#rc-eq"))    $("#rc-eq").value = S.acct.equity.toFixed(2);
}

/* ---------------------------------------------------------------- *
 * 19. BOOT
 * ---------------------------------------------------------------- */
function repaint(){
  paintHeader();
  if (V[S.view]) V[S.view].refresh();
}

function boot(){
  seedMarket();
  computeIndicators();
  ASSETS.forEach(a=>{
    evalCache.playbook[a] = evalPlaybook(a);
    evalCache.dualma[a] = {};
    evalCache.macd[a] = {};
    evalCache.turtle[a] = {};
    evalCache.rsi2[a] = {};
    evalCache.smc[a] = {};
    DUALMA_TFS.forEach(k => {
      evalCache.dualma[a][k] = evalDualMA(a, k);
      evalCache.macd[a][k]   = evalMacd(a, k);
      evalCache.turtle[a][k] = evalTurtle(a, k);
      evalCache.rsi2[a][k]   = evalRsi2(a, k);
      evalCache.smc[a][k]    = evalSmc(a, k);
    });
  });
  S.equityCurve.push(S.acct.equity);

  log("INFO","QUANT TERMINAL v2.4 啟動 — 模擬模式,未連接任何真實交易所端點。");
  log("INFO",`交易標的:BTC · ETH · SOL ｜ 交易所:Binance / Bitget 合約 ｜ 槓桿鎖定 20× 逐倉。`);
  log("INFO",`週期:基礎資料 15m ｜ 七關趨勢法於 4H 執行(方向看 W1、空間看 D1)｜ 雙均線同時運行 15m 與 4H。`);
  log("RISK",`風險模型:單筆 ${(CFG.riskPct*100).toFixed(1)}% · 止損 ≥ ${CFG.slAtrMult}×ATR(14) · 最低盈虧比 1:${CFG.minRR} · 保證金使用率 < ${CFG.maxMarginUse*100}%。`);
  log("RISK",`風控已啟用:日虧 -${CFG.breakers.daily*100}% · 週虧 -${CFG.breakers.weekly*100}% · 連虧 ${CFG.breakers.streak} 筆進入冷卻 · 單日最多 ${CFG.breakers.maxTradesDay} 筆。`);
  log("WARN","尚未連線交易所。請到「設定」填入 API 金鑰後才能執行交易。");

  cfgLoad(true);          // restore saved settings before first paint
  switchView("console");
  paintHeader();
  liveConnect();      // public market data only — no key, no account access
  beHealth().then(()=>{
    if (!BE.up) return;
    beBalance().then(()=>{ if (syncExchangesFromBackend()) repaint(); });
  });

  setInterval(() => {
    // A backtest swaps S.mkt / S.acct / S.positions for its own world; the live
    // loop must not touch them while that is in flight.
    if (S.paused){ if (S.view === "backtest") V.backtest.progress(); return; }
    tickPrices();
    jitterLatency();
    if (!BE.checking && Date.now()-BE.lastAt > 5000){
      beHealth().then(()=>{ if (BE.up) beBalance(); });
      BE.lastAt = Date.now();
    }
    if (Date.now() - S.lastBar > CFG.barMs){ S.lastBar = Date.now(); rollBar(); }
    runEngine();
    repaint();
  }, CFG.tickMs);

  setTimeout(()=>toast(
    `<b>模擬已啟動。</b><br><span style="font-size:11.5px">到「設定」隨意填入金鑰 →
     按<b>測試</b> → 開啟開關,機器人就會開始運作。</span>`,"a",11000), 900);
}

boot();
</script>
