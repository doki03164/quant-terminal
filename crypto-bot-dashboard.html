<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT TERMINAL — Crypto Auto-Trading Bot</title>
<style>
/* ============================================================
   DESIGN TOKENS  (matched to 交易操作手冊 / 趨勢交易完整教學)
   ============================================================ */
:root{
  --bg:#0e1116; --panel:#161b23; --panel2:#1c232d; --panel3:#212a35;
  --line:#2a333f; --line2:#374252;
  --tx:#e6edf3; --tx2:#a6b3c2; --tx3:#7d8b9b; --tx4:#5b6878;
  --up:#26a69a; --dn:#ef5350; --acc:#f0b429; --acc2:#4b9fe1; --vio:#a78bfa;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --hdr:56px; --nav:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .acc{color:var(--acc)}
.acc2{color:var(--acc2)} .vio{color:var(--vio)}
.t2{color:var(--tx2)} .t3{color:var(--tx3)} .t4{color:var(--tx4)}
.hide{display:none!important}

/* ============================ HEADER ============================ */
header{
  height:var(--hdr);border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;gap:0;padding:0 14px;position:relative;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;width:calc(var(--nav) - 14px);flex:none}
.brand .logo{
  width:28px;height:28px;border-radius:7px;background:linear-gradient(140deg,var(--acc),#c98d0c);
  display:grid;place-items:center;color:#14100a;font-weight:800;font-size:13px;font-family:var(--mono);
  flex:none;box-shadow:0 0 0 1px rgba(240,180,41,.35),0 2px 10px rgba(240,180,41,.18)
}
.brand .nm{font-size:13.5px;font-weight:700;letter-spacing:.02em;line-height:1.15}
.brand .sb{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--tx4);text-transform:uppercase}

.hdiv{width:1px;height:30px;background:var(--line);flex:none;margin:0 12px}

.exwrap{display:flex;gap:8px;flex:none}
.exchip{
  display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px 5px 9px;cursor:pointer;transition:.15s;user-select:none
}
.exchip:hover{border-color:var(--line2);background:var(--panel3)}
.exchip.on{border-color:rgba(38,166,154,.45);background:rgba(38,166,154,.07)}
.exchip.off{opacity:.62}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx4);flex:none}
.exchip.on .dot{background:var(--up);box-shadow:0 0 0 3px rgba(38,166,154,.16);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.exchip .lbl{font-size:12px;font-weight:600;line-height:1.2}
.exchip .lat{font-family:var(--mono);font-size:9.5px;color:var(--tx3);line-height:1.2}

.hstats{display:flex;gap:22px;margin-left:auto;align-items:center;flex:none}
.hstat{text-align:right;line-height:1.25}
.hstat .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--tx4);text-transform:uppercase}
.hstat .v{font-family:var(--mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

.levbadge{
  display:flex;align-items:center;gap:7px;background:rgba(240,180,41,.1);
  border:1px solid rgba(240,180,41,.42);border-radius:8px;padding:5px 11px;flex:none
}
.levbadge .x{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--acc);line-height:1}
.levbadge .m{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--acc);opacity:.8;text-transform:uppercase}

.kill{
  background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.5);color:var(--dn);
  border-radius:8px;padding:8px 15px;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.09em;cursor:pointer;transition:.15s;flex:none;text-transform:uppercase
}
.kill:hover{background:var(--dn);color:#fff;box-shadow:0 0 18px rgba(239,83,80,.4)}
.kill.armed{background:var(--dn);color:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}

/* ============================ LAYOUT ============================ */
.shell{display:flex;height:calc(100vh - var(--hdr))}
nav{
  width:var(--nav);flex:none;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;padding:12px 10px;overflow-y:auto
}
.navgrp{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--tx4);
  text-transform:uppercase;padding:14px 10px 7px}
.navitem{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;cursor:pointer;
  color:var(--tx2);font-size:13px;transition:.13s;position:relative;user-select:none
}
.navitem:hover{background:var(--panel2);color:var(--tx)}
.navitem.act{background:var(--panel3);color:var(--tx);font-weight:600}
.navitem.act::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2.5px;
  background:var(--acc);border-radius:0 3px 3px 0}
.navitem .ic{width:16px;text-align:center;font-size:13px;flex:none;opacity:.85}
.navitem .bdg{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:9px;
  background:var(--panel3);color:var(--tx3)}
.navitem .bdg.hot{background:rgba(240,180,41,.15);color:var(--acc)}
.navitem .bdg.grn{background:rgba(38,166,154,.15);color:var(--up)}
.navitem .bdg.red{background:rgba(239,83,80,.15);color:var(--dn)}

.navfoot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line)}
.navfoot .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--tx4);padding:3px 0}
.navfoot .r b{color:var(--tx3);font-weight:600}

main{flex:1;overflow-y:auto;padding:18px 20px 60px;position:relative}

/* ============================ PRIMITIVES ============================ */
.pgh{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.pgh h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.pgh .d{font-size:12.5px;color:var(--tx3);padding-bottom:2px}
.pgh .sp{margin-left:auto;display:flex;gap:8px;align-items:center}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1500px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1240px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:980px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.panel>.ph{
  display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);
  background:var(--panel2)
}
.panel>.ph .t{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.panel>.ph .s{font-family:var(--mono);font-size:9.5px;color:var(--tx4);letter-spacing:.1em;text-transform:uppercase}
.panel>.ph .sp{margin-left:auto;display:flex;gap:7px;align-items:center}
.panel>.pb{padding:15px}
.panel>.pb.tight{padding:0}

.tile{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.tile .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--tx4);
  text-transform:uppercase;display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1.3;margin-top:5px;
  font-variant-numeric:tabular-nums}
.tile .sv{font-size:11.5px;color:var(--tx3);font-family:var(--mono)}

.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
  font-weight:700;letter-spacing:.08em;padding:2.5px 8px;border-radius:5px;text-transform:uppercase;
  border:1px solid transparent;white-space:nowrap
}
.chip.g{background:rgba(38,166,154,.13);color:var(--up);border-color:rgba(38,166,154,.3)}
.chip.r{background:rgba(239,83,80,.13);color:var(--dn);border-color:rgba(239,83,80,.3)}
.chip.a{background:rgba(240,180,41,.13);color:var(--acc);border-color:rgba(240,180,41,.3)}
.chip.b{background:rgba(75,159,225,.13);color:var(--acc2);border-color:rgba(75,159,225,.3)}
.chip.v{background:rgba(167,139,250,.13);color:var(--vio);border-color:rgba(167,139,250,.3)}
.chip.n{background:var(--panel3);color:var(--tx3);border-color:var(--line)}

.btn{
  background:var(--panel3);border:1px solid var(--line2);color:var(--tx2);border-radius:7px;
  padding:6px 12px;font-size:12px;font-family:var(--sans);cursor:pointer;transition:.13s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap
}
.btn:hover{background:var(--line);color:var(--tx);border-color:var(--tx4)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:3.5px 9px;font-size:11px;border-radius:6px}
.btn.pri{background:rgba(240,180,41,.13);border-color:rgba(240,180,41,.45);color:var(--acc);font-weight:600}
.btn.pri:hover{background:var(--acc);color:#14100a}
.btn.grn{background:rgba(38,166,154,.13);border-color:rgba(38,166,154,.45);color:var(--up)}
.btn.grn:hover{background:var(--up);color:#04140f}
.btn.red{background:rgba(239,83,80,.13);border-color:rgba(239,83,80,.45);color:var(--dn)}
.btn.red:hover{background:var(--dn);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

input[type=text],input[type=password],input[type=number],select{
  background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:7px;
  padding:7px 10px;font-family:var(--mono);font-size:12.5px;width:100%;outline:none;transition:.13s
}
input:focus,select:focus{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(75,159,225,.13)}
input::placeholder{color:var(--tx4)}
select{cursor:pointer;font-family:var(--sans);font-size:12.5px}
label.fl{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--tx4);
  text-transform:uppercase;margin-bottom:5px}
.fld{margin-bottom:11px}

.sw{position:relative;width:38px;height:21px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{position:absolute;inset:0;background:var(--panel3);border:1px solid var(--line2);
  border-radius:11px;transition:.2s}
.sw .tr::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;
  background:var(--tx3);border-radius:50%;transition:.2s}
.sw input:checked + .tr{background:rgba(38,166,154,.28);border-color:var(--up)}
.sw input:checked + .tr::before{transform:translateX(17px);background:var(--up)}
.swrow{display:flex;align-items:center;gap:11px;padding:8px 0}
.swrow .txt{flex:1;min-width:0}
.swrow .txt .a{font-size:12.5px;color:var(--tx)}
.swrow .txt .b{font-size:11px;color:var(--tx3);line-height:1.45}

/* segmented control */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{
  background:none;border:none;color:var(--tx3);padding:4.5px 12px;border-radius:6px;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;transition:.13s;text-transform:uppercase
}
.seg button:hover{color:var(--tx2)}
.seg button.act{background:var(--panel3);color:var(--tx);font-weight:700}
.seg button.act.warn{background:rgba(240,180,41,.18);color:var(--acc)}
.seg button.act.grn{background:rgba(38,166,154,.18);color:var(--up)}

/* ============================ TABLES ============================ */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  text-align:left;padding:8px 13px;background:var(--panel2);color:var(--tx4);font-weight:600;
  font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2
}
td{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--tx2);white-space:nowrap;
   vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:34px 15px;text-align:center;color:var(--tx4);font-size:12.5px}
.empty .big{font-size:26px;opacity:.28;margin-bottom:8px}

/* ============================ GATE FUNNEL ============================ */
.gaterow{
  display:flex;align-items:center;gap:11px;padding:8px 13px;border-bottom:1px solid var(--line);
  font-size:12px;transition:.15s
}
.gaterow:last-child{border-bottom:none}
.gaterow .no{
  font-family:var(--mono);font-size:9px;font-weight:700;padding:2.5px 7px;border-radius:4px;
  letter-spacing:.06em;flex:none;background:var(--panel3);color:var(--tx3);min-width:50px;text-align:center
}
.gaterow.pass .no{background:rgba(38,166,154,.16);color:var(--up)}
.gaterow.fail .no{background:rgba(239,83,80,.16);color:var(--dn)}
.gaterow.wait .no{background:rgba(240,180,41,.16);color:var(--acc)}
.gaterow.skip{opacity:.34}
.gaterow .ttl{color:var(--tx);flex:none;width:118px;font-size:12px}
.gaterow .det{color:var(--tx3);font-family:var(--mono);font-size:10.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.gaterow .st{margin-left:auto;flex:none}

.assetcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.assetcard.armed{border-color:rgba(38,166,154,.45);box-shadow:0 0 0 1px rgba(38,166,154,.16)}
.assetcard.blocked{border-color:rgba(239,83,80,.3)}
.ach{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel2);
  border-bottom:1px solid var(--line)}
.ach .sym{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.02em}
.ach .px{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
.ach .chg{font-family:var(--mono);font-size:10.5px;min-width:56px;text-align:right}

/* price ticker cards */
.tick{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  position:relative;overflow:hidden}
.tick .top{display:flex;align-items:baseline;gap:8px}
.tick .sym{font-family:var(--mono);font-size:13px;font-weight:700}
.tick .ex{font-family:var(--mono);font-size:9px;color:var(--tx4);letter-spacing:.1em}
.tick .price{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1.3;margin-top:2px;
  font-variant-numeric:tabular-nums;transition:color .35s}
.tick .price.flashu{color:var(--up)} .tick .price.flashd{color:var(--dn)}
.tick .meta{display:flex;gap:12px;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--tx3);flex-wrap:wrap}
.tick .spark{margin-top:9px;height:38px;width:100%;display:block}

.bar{height:5px;background:var(--panel3);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .4s}

/* logs */
.logline{
  display:flex;gap:11px;padding:4.5px 14px;font-family:var(--mono);font-size:11.5px;
  border-bottom:1px solid rgba(42,51,63,.45);line-height:1.5
}
.logline:hover{background:var(--panel2)}
.logline .ts{color:var(--tx4);flex:none}
.logline .lv{flex:none;width:46px;font-weight:700;font-size:9.5px;letter-spacing:.07em;padding-top:1px}
.logline .ms{color:var(--tx2);flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.lv.INFO{color:var(--acc2)} .lv.WARN{color:var(--acc)} .lv.ERR{color:var(--dn)}
.lv.EXEC{color:var(--vio)} .lv.GATE{color:var(--tx3)} .lv.RISK{color:var(--up)}

/* callouts */
.note{border-radius:9px;padding:11px 14px;font-size:12px;line-height:1.6;color:var(--tx2)}
.note.warn{background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.28)}
.note.bad{background:rgba(239,83,80,.07);border:1px solid rgba(239,83,80,.28)}
.note.good{background:rgba(38,166,154,.07);border:1px solid rgba(38,166,154,.28)}
.note.info{background:rgba(75,159,225,.07);border:1px solid rgba(75,159,225,.28)}
.note b{color:var(--tx)}
.note .h{font-weight:700;color:var(--tx);margin-bottom:4px;display:flex;align-items:center;gap:7px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(8,10,14,.78);backdrop-filter:blur(3px);z-index:100;
  display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:13px;max-width:480px;
  width:100%;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal .mh{padding:15px 19px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700;
  display:flex;align-items:center;gap:9px}
.modal .mb{padding:17px 19px;color:var(--tx2);font-size:13px;line-height:1.65}
.modal .mf{padding:13px 19px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  background:var(--panel2)}

/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left-width:3px;border-radius:9px;
  padding:10px 15px;font-size:12.5px;color:var(--tx2);max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.45);
  animation:sl .22s ease-out}
.toast.g{border-left-color:var(--up)} .toast.r{border-left-color:var(--dn)}
.toast.a{border-left-color:var(--acc)} .toast.b{border-left-color:var(--acc2)}
.toast b{color:var(--tx)}
@keyframes sl{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}

/* halted banner */
.halt{
  background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.42);border-radius:10px;
  padding:11px 15px;display:flex;align-items:center;gap:12px;margin-bottom:14px
}
.halt .ttl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--dn);
  text-transform:uppercase}
.halt .ds{font-size:12px;color:var(--tx2)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:5.5px 0;font-size:12.5px;
  border-bottom:1px solid rgba(42,51,63,.5)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}
.kv .v{font-family:var(--mono);color:var(--tx);font-variant-numeric:tabular-nums;text-align:right}

.disc{margin-top:26px;padding:15px 17px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);font-size:11.5px;color:var(--tx4);line-height:1.75}
.disc b{color:var(--tx3)}

/* ==================== SIMPLIFIED SHELL ==================== */
:root{--nav:180px}
.wrapn{max-width:1180px;margin:0 auto}

/* status banner — one plain sentence, always the first thing you read */
.status{display:flex;align-items:center;gap:15px;padding:16px 20px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:14px;flex-wrap:wrap}
.status .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  font-size:17px;flex:none}
.status .msg{flex:1;min-width:200px}
.status .msg .a{font-size:15.5px;font-weight:600;color:var(--tx);line-height:1.35}
.status .msg .b{font-size:12.5px;color:var(--tx3);margin-top:3px}
.status .act{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.status.on{border-color:rgba(38,166,154,.42);background:rgba(38,166,154,.05)}

<script>
"use strict";
/* ==================================================================
   QUANT TERMINAL — Crypto Futures Auto-Trading Bot Dashboard
   ------------------------------------------------------------------
   SIMULATION ONLY. No network calls are made. All prices, fills and
   balances come from a local stochastic market model. The exchange
   panels are UI + validation scaffolding; wiring them to real order
   endpoints requires a server-side signer (see notes in Exchange view).
   ================================================================== */

/* ---------------------------------------------------------------- *
 * 1. CONFIG
 * ---------------------------------------------------------------- */
const CFG = {
  leverage: 20,                 // hard locked
  maintMarginRate: 0.004,       // 0.4% — for liquidation estimate
  takerFee: 0.0005,             // 5 bps per side
  riskPct: 0.01,                // GATE 5: max 1% per trade
  minRR: 2.0,                   // GATE 5: min 1:2
  slAtrMult: 2.0,               // GATE 5: SL >= 2x ATR
  maxMarginUse: 0.80,           // margin utilisation < 80%
  minConfluence: 3,             // GATE 4: >= 3 confluences
  breakers: { daily: 0.02, weekly: 0.05, streak: 3, maxTradesDay: 2 },
  // Volatility targeting — see volScalar(). Off by default so it is an
  // explicit choice, not something that silently changes your position sizes.
  volTarget: { on: false, lookback: 60, min: 0.5, max: 1.5 },
  barMs: 1500,                  // one simulated 15m bar every 1.5s
  tickMs: 700,
  // trendStrength: per-15m-bar drift as a fraction of per-bar vol while a regime
  // is trending. At 4H the effective ratio is 4× this, so 0.065 gives ~0.26 —
  // 15m stays near-random (as real intraday crypto is) while 4H trends cleanly
  // enough to print HH/HL without pinning ADX at implausible extremes.
  trendStrength: 0.065,
  history: 26880,               // 15m bars kept = 280 simulated days (W1 needs depth)
  // Base series is 15m; every other timeframe is derived from it so the
  // timeframes can never disagree with each other.
  assets: {                     // vol is per 15m bar
    BTC: { px: 118420.5, vol: 0.0021, dp: 1, qstep: 0.001 },
    ETH: { px: 4187.62,  vol: 0.0028, dp: 2, qstep: 0.01  },
    SOL: { px: 214.870,  vol: 0.0036, dp: 3, qstep: 0.1   },
  },
};
const ASSETS = Object.keys(CFG.assets);

/* Timeframe registry — ratio is in 15m bars. lr is the swing-pivot lookback,
   which must shrink as the derived series gets shorter. cap limits how many
   derived bars we build (deep history is only needed on the slow frames). */
const TF = {
  m15: { label:"15m", ratio:1,   lr:3, cap:900 },   // faster frame → tighter pivots
  h1:  { label:"1H",  ratio:4,   lr:5, cap:600 },
  h4:  { label:"4H",  ratio:16,  lr:5, cap:520 },
  d1:  { label:"D1",  ratio:96,  lr:3, cap:300 },
  w1:  { label:"W1",  ratio:672, lr:2, cap:60  },
};
// Execution timeframe for the playbook, plus the two context layers above it.
// The manual runs on 1H with 4H+D1 context; 4H shifts everything up one step
// and cuts setup frequency roughly 4x, which is a structural consequence of the
// timeframe choice rather than a filter being too strict.
const PB_TFS = {
  h1: { exec:"h1", htf:"h4", top:"d1", label:"1H", need:["1h","4h","1d"] },
  h4: { exec:"h4", htf:"d1", top:"w1", label:"4H", need:["4h","1d","1w"] },
};
let PLAYBOOK_TF = "h4";
const DUALMA_TFS  = ["m15","h4"];      // 雙均線系統 runs on both

// Volume calibration: live bars accumulate per tick, seeded bars are drawn in
// one shot — derive the seed mean from the tick model so the two match.
const TPB = CFG.barMs / CFG.tickMs;
const VOL_BASE = 25, VOL_MULT = 530;
const VOL_MEAN = TPB*VOL_BASE + Math.sqrt(TPB)*0.798*VOL_MULT;
const EXCHANGES = ["binance", "bitget"];
const EXNAME = { binance: "Binance Futures", bitget: "Bitget Futures" };

/* ---------------------------------------------------------------- *
 * 2. STATE
 * ---------------------------------------------------------------- */
const S = {
  view: "console",
  btSrc: "real",                // 回測資料來源:real | sim
  paused: false,                // true while a backtest owns the world
  btMode: false,                // true while running inside the backtest engine
  liveOrders: false,            // dashboard may send real orders (off by default)
  booted: Date.now(),
  engine: "IDLE",              // IDLE | RUNNING | HALTED | KILLED
  killed: false,
  testnet: true,

  ex: {
    binance: { on:false, key:"", secret:"", pass:"", lat:null, tier:null, testing:false },
    bitget:  { on:false, key:"", secret:"", pass:"", lat:null, tier:null, testing:false },
  },

  acct: {
    start: 10000,
    equity: 10000,
    realized: 0,
    fees: 0,
    dayAnchor: 10000,
    weekAnchor: 10000,
    peak: 10000,
  },

  strat: {
    playbook: { on:true,  alloc:{BTC:true, ETH:true, SOL:true} },   // 4H only
    dualma:   { on:false, alloc:{BTC:true, ETH:true, SOL:true},
                tf:{ m15:true, h4:true },
                fast:5, slow:20, adxMin:22, volMult:1.2, useTrendFilter:true },
    smc:      { on:false, alloc:{BTC:true, ETH:true, SOL:true},
                tf:{ m15:false, h4:true },
                sweepLookback:40, sweepWithin:12, zonePad:0.15 },
    turtle:   { on:false, alloc:{BTC:true, ETH:true, SOL:true},
                tf:{ m15:false, h4:true },
                system:1, entryN:20, exitN:10, entryN2:55, exitN2:20,
                atrN:20, stopN:2, useLossFilter:true },
    rsi2:     { on:false, alloc:{BTC:true, ETH:true, SOL:true},
                tf:{ m15:true, h4:false },
                rsiLen:2, trendLen:200, buyBelow:5, sellAbove:95,
                stopAtr:2, rr:1.0 },
    macd:     { on:false, alloc:{BTC:true, ETH:true, SOL:true},
                tf:{ m15:false, h4:true },
                fast:12, slow:26, signal:9, trendLen:120, maxDist:3.0, rr:2.0 },
  },

  positions: [],
  closed: [],
  orders: [],            // pending limit orders
  logs: [],
  signals: [],           // recent evaluations for the feed
  equityCurve: [],

  breaker: { daily:false, weekly:false, streak:false, cooldownUntil:0, streakCount:0, tradesToday:0 },

  mkt: {},               // per-asset market model
  seq: 1,
  lastBar: 0,
  logFilter: "",
};

/* ---------------------------------------------------------------- *
 * 3. HELPERS
 * ---------------------------------------------------------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => (S.seq++).toString(36).padStart(4,"0").toUpperCase();

function fmt(n, dp=2){
  if (n === null || n === undefined || !isFinite(n)) return "—";
  return Number(n).toLocaleString("en-US",{minimumFractionDigits:dp, maximumFractionDigits:dp});
}
function usd(n, dp=2){ return (n<0?"-$":"$") + fmt(Math.abs(n), dp); }
function sgn(n, dp=2, pre="$"){
  const s = n>=0 ? "+" : "-";
  return s + pre + fmt(Math.abs(n), dp);
}
function pct(n, dp=2){ return (n>=0?"+":"") + fmt(n*100, dp) + "%"; }
function cls(n){ return n>0 ? "up" : n<0 ? "dn" : "t3"; }
function hhmmss(ms){
  const s = Math.floor(ms/1000);
  return [Math.floor(s/3600), Math.floor(s/60)%60, s%60]
    .map(v=>String(v).padStart(2,"0")).join(":");
}
function clock(t=Date.now()){
  const d = new Date(t);
  return [d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,"0")).join(":");
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function roundStep(v, step){ return Math.round(v/step)*step; }

function log(level, msg){
  S.logs.unshift({ t:Date.now(), level, msg });
  if (S.logs.length > 500) S.logs.length = 500;
}
function toast(msg, kind="b", ms=4200){
  if (S.btMode) return;              // a backtest would emit thousands of these
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s";
                   setTimeout(()=>el.remove(),300); }, ms);
}

/* ---------------------------------------------------------------- *
 * 4. MARKET MODEL  — synthetic 1H candles with trending regimes
 * ---------------------------------------------------------------- */
function gauss(){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

/** Pick the next regime's per-bar drift: trend up / trend down / range */
function nextDrift(vol){
  const r = Math.random(), d = vol * CFG.trendStrength * (0.75 + Math.random()*0.6);
  return r < 0.40 ? d : r < 0.80 ? -d : 0;
}

/** Regime length in 15m bars. ~1200–3000 bars = 75–187 bars at 4H, so the
 *  playbook's execution timeframe sees trends that run for tens of bars. */
const nextRegime = () => 1200 + Math.floor(Math.random()*1800);

function seedMarket(){
  ASSETS.forEach(a => {
    const c = CFG.assets[a];
    const bars = [];
    let px = c.px * (0.86 + Math.random()*0.06);
    let drift = nextDrift(c.vol);
    let regime = nextRegime();
    // Volume clustering. Without persistence, per-bar volume is independent and
    // aggregating 16 bars into a 4H candle averages the dispersion to nothing —
    // a relative-volume filter then never triggers on higher timeframes.
    let act = 1;

    for (let i=0;i<CFG.history;i++){
      if (--regime <= 0){
        drift = nextDrift(c.vol);
        // soft band-keeping so 280 days of compounding cannot wander orders of
        // magnitude away from a plausible price
        if (px > c.px*2.2) drift = -Math.abs(drift);
        else if (px < c.px*0.45) drift = Math.abs(drift);
        regime = nextRegime();
      }
      const o = px;
      const shock = gauss()*c.vol;
      px = px * (1 + drift + shock);
      const hi = Math.max(o,px) * (1 + Math.abs(gauss())*c.vol*0.42);
      const lo = Math.min(o,px) * (1 - Math.abs(gauss())*c.vol*0.42);
      // Volume tracks realized movement — a flat bar is a quiet bar. Mean is
      // matched to the live per-tick accumulator in tickPrices().
      act = clamp(act + (1-act)*0.01 + gauss()*0.05*act, 0.3, 3.2);
      const vol = VOL_MEAN * (0.45 + Math.abs(shock)/c.vol*0.69) * act;
      bars.push({ o, h:hi, l:lo, c:px, v:vol });
    }
    // normalise the last close toward the configured spot
    const k = c.px / px;
    bars.forEach(b => { b.o*=k; b.h*=k; b.l*=k; b.c*=k; });

    S.mkt[a] = {
      bars,
      last: bars[bars.length-1].c,
      prev: bars[bars.length-1].c,
      dayOpen: bars[bars.length-96] ? bars[bars.length-96].c : bars[0].c,
      drift, regime,
      ind: null, tf: {}, act,
      barIdx: bars.length - 1,      // absolute index of the newest base bar

      cross: { m15:null, h4:null },
      seen:  { m15:{bar:-1, above:null}, h4:{bar:-1, above:null} },
    };
  });
}

function tickPrices(){
  ASSETS.forEach(a => {
    const m = S.mkt[a], c = CFG.assets[a];
    if (--m.regime <= 0){
      m.drift = nextDrift(c.vol);
      m.regime = 40 + Math.floor(Math.random()*70);
    }
    m.prev = m.last;
    const step = c.vol / Math.sqrt(CFG.barMs/CFG.tickMs);
    m.last = m.last * (1 + m.drift/(CFG.barMs/CFG.tickMs) + gauss()*step);
    const ret = (m.last - m.prev) / m.prev;

    const b = m.bars[m.bars.length-1];
    b.c = m.last;
    // Only ~2 ticks land per bar, so tracking the tick path alone produces
    // wickless bars: |h-l| would always equal |o-c|. That silently breaks pin-bar
    // detection (which needs a wick ≥40% of range) and distorts swing pivots.
    // Extend the range to represent movement between ticks.
    const w = Math.abs(gauss()) * step * 0.55;
    b.h = Math.max(b.h, m.last*(1+w));
    b.l = Math.min(b.l, m.last*(1-w));
    m.act = clamp(m.act + (1-m.act)*0.01 + gauss()*0.05*m.act, 0.3, 3.2);
    b.v += (25 + (Math.abs(ret)/c.vol) * 530) * m.act;   // calibrated to seedMarket()
  });
}

function rollBar(){
  ASSETS.forEach(a => {
    const m = S.mkt[a];
    m.bars.push({ o:m.last, h:m.last, l:m.last, c:m.last, v:0 });
    if (m.bars.length > CFG.history) m.bars.shift();
    m.barIdx++;
    m.dayOpen = m.bars[Math.max(0, m.bars.length-96)].c;   // 96 × 15m = 24h
  });
}

/* ---------------------------------------------------------------- *
 * 5. INDICATORS
 * ---------------------------------------------------------------- */
function ema(vals, p){
  const k = 2/(p+1), out = [];
  let e = vals[0];
  for (let i=0;i<vals.length;i++){ e = i ? vals[i]*k + e*(1-k) : vals[i]; out.push(e); }
  return out;
}
function atr(bars, p=14){
  const tr = [];
  for (let i=0;i<bars.length;i++){
    const b = bars[i], pv = i ? bars[i-1].c : b.o;
    tr.push(Math.max(b.h-b.l, Math.abs(b.h-pv), Math.abs(b.l-pv)));
  }
  // Wilder smoothing
  let a = tr.slice(0,p).reduce((x,y)=>x+y,0)/p;
  for (let i=p;i<tr.length;i++) a = (a*(p-1)+tr[i])/p;
  return a;
}
/** Wilder ADX. Seeds the smoothers with a proper p-bar sum and uses a long
 *  warmup — seeding from a single bar (as a short window forces) leaves the
 *  reading stuck near its initial DX and pins ADX far too high. */
function adx(bars, p=14){
  // Shorten the period rather than returning 0 on short series — W1 only ever
  // holds ~40 bars, and a hard 0 would make every weekly read "RANGING".
  if (bars.length < 18) return 0;
  p = Math.min(p, Math.floor(bars.length/3));
  const src = bars.slice(-Math.min(bars.length, p*10));
  const TRa=[], PDMa=[], NDMa=[];
  for (let i=1;i<src.length;i++){
    const h=src[i].h, l=src[i].l, ph=src[i-1].h, pl=src[i-1].l, pc=src[i-1].c;
    const up=h-ph, dn=pl-l;
    PDMa.push((up>dn && up>0) ? up : 0);
    NDMa.push((dn>up && dn>0) ? dn : 0);
    TRa.push(Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)));
  }
  if (TRa.length < p*2) return 0;
  const sum = (arr,n) => arr.slice(0,n).reduce((a,b)=>a+b,0);
  let tr=sum(TRa,p), pdm=sum(PDMa,p), ndm=sum(NDMa,p);
  const dxs=[];
  const dxOf = () => {
    if (tr <= 0) return 0;
    const pdi = 100*pdm/tr, ndi = 100*ndm/tr;
    return (pdi+ndi) ? 100*Math.abs(pdi-ndi)/(pdi+ndi) : 0;
  };
  dxs.push(dxOf());
  for (let i=p;i<TRa.length;i++){
    tr  = tr  - tr/p  + TRa[i];
    pdm = pdm - pdm/p + PDMa[i];
    ndm = ndm - ndm/p + NDMa[i];
    dxs.push(dxOf());
  }
  if (dxs.length < p) return dxs[dxs.length-1] || 0;
  let a = sum(dxs,p)/p;
  for (let i=p;i<dxs.length;i++) a = (a*(p-1)+dxs[i])/p;
  return a;
}

/** Swing pivots — 5 bars either side, per 交易操作手冊 GATE 1 */
function swings(bars, lr=5){
  const out = [];
  for (let i=lr;i<bars.length-lr;i++){
    let isH=true, isL=true;
    for (let j=i-lr;j<=i+lr;j++){
      if (j===i) continue;
      if (bars[j].h >= bars[i].h) isH=false;
      if (bars[j].l <= bars[i].l) isL=false;
    }
    if (isH) out.push({ i, p:bars[i].h, type:"H" });
    else if (isL) out.push({ i, p:bars[i].l, type:"L" });
  }
  // enforce alternation, keep the most extreme of consecutive same-type pivots
  const alt = [];
  out.forEach(s => {
    const last = alt[alt.length-1];
    if (!last || last.type !== s.type) alt.push(s);
    else if ((s.type==="H" && s.p>last.p) || (s.type==="L" && s.p<last.p)) alt[alt.length-1]=s;
  });
  return alt;
}

/** Label the pivot sequence HH/HL/LH/LL and derive structure.
 *  `lr` must scale with series length — 5 bars either side on a 30-bar daily
 *  series detects almost nothing, so higher timeframes use a tighter window. */
function structure(bars, lr=5){
  const sw = swings(bars, lr);
  const lab = [];
  for (let i=2;i<sw.length;i++){
    const cur = sw[i], prevSame = sw[i-2];
    if (cur.type==="H") lab.push({ ...cur, tag: cur.p > prevSame.p ? "HH" : "LH" });
    else                lab.push({ ...cur, tag: cur.p < prevSame.p ? "LL" : "HL" });
  }
  const tail = lab.slice(-6);
  const bull = tail.filter(l => l.tag==="HH"||l.tag==="HL");
  const bear = tail.filter(l => l.tag==="LH"||l.tag==="LL");
  let dir = "NONE", run = 0;

  // count trailing consecutive same-direction labels
  const isBull = t => t==="HH"||t==="HL";
  const isBear = t => t==="LH"||t==="LL";
  if (tail.length){
    const lastTag = tail[tail.length-1].tag;
    const test = isBull(lastTag) ? isBull : isBear;
    for (let i=tail.length-1;i>=0;i--){ if (test(tail[i].tag)) run++; else break; }
    if (run >= 3) dir = isBull(lastTag) ? "UP" : "DOWN";
  }
  return { sw, lab, dir, run, bullN:bull.length, bearN:bear.length,
           lastH: [...lab].reverse().find(l=>l.type==="H"),
           lastL: [...lab].reverse().find(l=>l.type==="L") };
}

/** Resample the 15m base series onto a FIXED higher-timeframe grid.
 *  Candle boundaries are anchored to absolute multiples of `n` (absEnd is the
 *  absolute index of the newest base bar), so a 4H candle always covers the same
 *  16 base bars a real chart would. Anchoring to the newest bar instead makes
 *  the whole grid re-phase every 15m and jitters structure labels; anchoring to
 *  array index 0 re-phases whenever the rolling buffer shifts.
 *  The trailing group is the still-forming candle, exactly as on a live chart. */
function resampleGrid(bars, n, absEnd, cap){
  if (n === 1) return cap && bars.length>cap ? bars.slice(-cap) : bars;
  const total = bars.length;
  if (!total) return [];
  const absStart = absEnd - total + 1;
  const skip = ((n - (absStart % n)) % n);       // offset to the first boundary
  const out = [];
  for (let i=skip; i<total; i+=n){
    const end = Math.min(i+n, total);
    let h=-Infinity, l=Infinity, v=0;
    for (let j=i;j<end;j++){
      const b = bars[j];
      if (b.h>h) h=b.h;
      if (b.l<l) l=b.l;
      v += b.v;
    }
    out.push({ o:bars[i].o, c:bars[end-1].c, h, l, v });
  }
  return cap && out.length>cap ? out.slice(-cap) : out;
}

/** The five market stages (震盪 / 突破 / 趨勢 / 反轉 / 無結構).
 *  GATE 3 asks the daily for a *regime call*, not an HH/HL count — a 50-bar
 *  daily series rarely carries three clean pivot labels, so classify it from
 *  structure + EMA slope + ADX together. */
function regimeStage(bars, st){
  if (bars.length < 12) return { stage:"NO STRUCTURE", dir:"NONE" };
  const cl = bars.map(b=>b.c);
  const p  = Math.min(20, Math.max(5, Math.floor(bars.length/3)));
  const e  = ema(cl, p), n = e.length;
  const back = Math.min(6, n-1);
  const slope = (e[n-1]-e[n-1-back]) / e[n-1-back];
  const a = adx(bars, 14);
  const mag = Math.abs(slope);
  const sDir = slope > 0 ? "UP" : "DOWN";

  // structure and momentum disagree → the market is turning
  if (st.dir !== "NONE" && st.dir !== sDir && mag > 0.012)
    return { stage:"REVERSING", dir:"NONE" };
  if (st.dir !== "NONE" && a >= 20)
    return { stage: st.dir==="UP" ? "TREND UP" : "TREND DOWN", dir: st.dir };
  if (mag > 0.020 && a >= 22)
    return { stage: sDir==="UP" ? "BREAKOUT UP" : "BREAKOUT DOWN", dir: sDir };
  if (a < 18 || mag < 0.008)
    return { stage:"RANGING", dir:"NONE" };
  return { stage: sDir==="UP" ? "TREND UP" : "TREND DOWN", dir: sDir };
}

/** Nearest 4H/D1 structural level *in the direction of the trade*.
 *  Taking the closest swing level without checking its side lets a short book a
 *  "target" above its entry, which fills instantly at a loss. Returns null when
 *  the direction has no defined structural target — GATE 3 then rejects. */
function nextKeyLevel(m, dir, px, minDist){
  const lv = [];
  const P = PB_TFS[PLAYBOOK_TF];
  // GATE 3 measures room to the next HIGHER-timeframe key level
  // (「到下一個 4H/日線關鍵位」). Including the execution frame's own swing
  // points puts the target far too close and starves the gate of room — that
  // regression took the strategy to zero trades.
  [m.tf[P.htf], m.tf[P.top]]
    .forEach(t => t && t.st && t.st.lab.forEach(l => lv.push(l.p)));
  const ahead = dir === "UP" ? lv.filter(v => v > px*1.0008)
                             : lv.filter(v => v < px*0.9992);
  if (!ahead.length) return null;
  // 「保守 = 下一個擺動點,積極 = 更高框架的下一個 S/R」— always taking the
  // NEAREST level starves the reward side, so step outward to the first level
  // that can actually carry the minimum RR before falling back to the furthest.
  if (minDist > 0){
    const ok = ahead.filter(v => Math.abs(v - px) >= minDist);
    if (ok.length) return dir === "UP" ? Math.min(...ok) : Math.max(...ok);
    return dir === "UP" ? Math.max(...ahead) : Math.min(...ahead);
  }
  return dir === "UP" ? Math.min(...ahead) : Math.max(...ahead);
}

/** Impulse-leg count → GATE 2 trend maturity */
function maturity(st){
  const legs = st.lab.length;
  let n = 0;
  const isBull = t => t==="HH"||t==="HL";
  const want = st.dir === "UP" ? isBull : (t=>t==="LH"||t==="LL");
  for (let i=st.lab.length-1;i>=0;i--){ if (want(st.lab[i].tag)) n++; else break; }
  const impulses = Math.ceil(n/2);
  return impulses <= 2 ? { stage:"EARLY", impulses } :
         impulses <= 5 ? { stage:"MID",   impulses } :
                         { stage:"MATURE",impulses };
}

/** Confirmation candle — pinbar / engulfing (GATE 6) */
function confirmCandle(bars, dir){
  const b = bars[bars.length-2] || bars[bars.length-1];   // last CLOSED bar
  const p = bars[bars.length-3] || b;
  const range = b.h - b.l;
  if (range <= 0) return null;
  const body = Math.abs(b.c-b.o);
  const upW = b.h - Math.max(b.c,b.o);
  const dnW = Math.min(b.c,b.o) - b.l;

  if (dir === "UP"){
    if (dnW/range >= 0.40 && b.c > b.o)        return { kind:"PIN BAR", wick:dnW/range };
    if (b.c > p.o && b.o < p.c && p.c < p.o)   return { kind:"ENGULFING", wick:dnW/range };
  } else {
    if (upW/range >= 0.40 && b.c < b.o)        return { kind:"PIN BAR", wick:upW/range };
    if (b.c < p.o && b.o > p.c && p.c > p.o)   return { kind:"ENGULFING", wick:upW/range };
  }
  return null;
}

/** Full indicator set for one timeframe's bar series. */
function analyze(bars, lr){
  const cl = bars.map(b=>b.c);
  const last = arr => arr[arr.length-1];
  const e25 = ema(cl,25), e50 = ema(cl,50);
  const F = S.strat.dualma.fast, L = S.strat.dualma.slow;
  const ef = ema(cl,F), el = ema(cl,L);
  const st = structure(bars, lr);
  const n = bars.length;
  return {
    bars,
    e25:last(e25), e50:last(e50),
    fast:last(ef), slow:last(el),
    atr: atr(bars,14),
    adx: adx(bars,14),
    st, mat: maturity(st),
    stage: regimeStage(bars, st),
    // Compare the last *completed* bar against the 20 before it. The forming
    // bar is only partially accumulated, so measuring it against full bars
    // would bias every reading low.
    vol: n>1 ? bars[n-2].v : 0,
    volAvg: n>22 ? bars.slice(-22,-2).reduce((s,b)=>s+b.v,0)/20 : 1,
  };
}

const CROSS_WINDOW = 2;   // bars a fresh cross stays actionable

function computeIndicators(){
  ASSETS.forEach(a => {
    const m = S.mkt[a];
    m.tf = {};
    for (const k in TF){
      const t = TF[k];
      m.tf[k] = analyze(resampleGrid(m.bars, t.ratio, m.barIdx, t.cap), t.lr);
      m.tf[k].key = k;
      m.tf[k].label = t.label;
      m.tf[k].barIdx = Math.floor(m.barIdx / t.ratio);
    }
    // legacy alias so anything still reading m.ind gets the execution timeframe
    m.ind = m.tf[PB_TFS[PLAYBOOK_TF].exec];

    // Cross detection is a *bar-close* event, tracked independently per
    // timeframe. Evaluating it per tick means the volume/ADX/structure filters
    // would all have to coincide on the exact crossing tick, which effectively
    // never happens — so latch the cross and let it stay actionable briefly.
    DUALMA_TFS.forEach(k => {
      const I = m.tf[k], seen = m.seen[k];
      if (seen.bar !== I.barIdx){
        seen.bar = I.barIdx;
        const above = I.fast > I.slow;
        if (seen.above !== null && above !== seen.above)
          m.cross[k] = { dir: above ? "UP" : "DOWN", at: I.barIdx };
        seen.above = above;
      }
    });
  });
}

/* ---------------------------------------------------------------- *
 * 6. STRATEGY 1 — 7-GATE TREND PLAYBOOK
 * ---------------------------------------------------------------- */
const GATE_TITLES = [
  "Structure","Maturity","MTF Align","HPCZ Entry","Risk Calc","Confirmation","Execution"
];

/* Execution timeframe is 4H; the manual's three-layer split shifts up with it,
   so direction now comes from W1 and room-to-target from D1. */
function evalPlaybook(asset){
  const P = PB_TFS[PLAYBOOK_TF];
  const m = S.mkt[asset], I = m.tf[P.exec], px = m.last;
  const HTF = m.tf[P.htf], TOP = m.tf[P.top];
  if (!I || !HTF || !TOP) return { gates:[], ok:false, stop:0 };
  const g = [];
  const push = (n,state,det) => g.push({ n, title:GATE_TITLES[n-1], state, det });
  const skipRest = from => { for (let k=from;k<=7;k++) push(k,"skip","—"); };

  /* GATE 1 — 4H structure filter: >= 3 same-direction labels */
  const st = I.st;
  if (st.dir === "NONE"){
    push(1,"fail",`no clean structure · run=${st.run}/3`);
    skipRest(2);
    return { gates:g, ok:false, stop:1 };
  }
  const tags = st.lab.slice(-4).map(l=>l.tag).join(" ");
  push(1,"pass",`${st.dir} · ${st.run} labels · ${tags}`);
  const dir = st.dir;
  const side = dir === "UP" ? "LONG" : "SHORT";

  /* GATE 2 — trend maturity */
  const mat = I.mat;
  const dev = Math.abs(px - I.e50) / I.atr;
  if (mat.stage === "MATURE"){
    push(2,"fail",`${mat.stage} · ${mat.impulses} impulse legs → skip`);
    skipRest(3); return { gates:g, ok:false, stop:2, dir, side };
  }
  if (dev > 6){
    push(2,"fail",`extended · ${dev.toFixed(1)}× ATR from 50 EMA`);
    skipRest(3); return { gates:g, ok:false, stop:2, dir, side };
  }
  push(2,"pass",`${mat.stage} · ${mat.impulses} legs · dev ${dev.toFixed(1)}×ATR`);

  /* GATE 3 — D1 + W1 alignment + room to the next key level */
  // The manual prohibits trading AGAINST the higher timeframe
  // (「絕不逆著高時間框架做單」) — it does not require the higher timeframe to
  // positively confirm. Vetoing whenever D1 is merely unclear was my own
  // stricter reading and it removed the large majority of valid setups.
  const d1Struct = HTF.st.dir;
  const d1d = d1Struct !== "NONE" ? d1Struct : HTF.stage.dir;
  const W = TOP.stage;
  if (d1d !== "NONE" && d1d !== dir){
    push(3,"fail",`${P.htf.toUpperCase()}=${d1d} 逆於 ${P.label}=${dir} · 不可逆高週期`);
    skipRest(4); return { gates:g, ok:false, stop:3, dir, side };
  }
  // Per the manual, the top frame only has to be *clearly identifiable* — 日線階段
  // 能明確判定,不是無結構或反轉中. It is the immediately higher frame (here D1)
  // that must share direction. Demanding directional agreement from the top frame
  // too is stricter than the source and cuts valid setups roughly in half.
  if (W.stage === "REVERSING" || (W.dir !== "NONE" && W.dir !== dir)){
    push(3,"fail",`${P.top.toUpperCase()} = ${W.stage} 逆向 → 不可交易`);
    skipRest(4); return { gates:g, ok:false, stop:3, dir, side };
  }
  // reward must clear minRR x (2xATR stop) for the setup to be worth measuring
  const keyLvl = nextKeyLevel(m, dir, px, CFG.minRR * CFG.slAtrMult * I.atr);
  if (keyLvl === null){
    push(3,"fail",`no HTF structural target ${dir==="UP"?"above":"below"} price`);
    skipRest(4); return { gates:g, ok:false, stop:3, dir, side };
  }
  const room = Math.abs(keyLvl - px) / I.atr;
  if (room < 2.2){
    push(3,"fail",`only ${room.toFixed(1)}×ATR to HTF level — no room for 1:2`);
    skipRest(4); return { gates:g, ok:false, stop:3, dir, side };
  }
  push(3,"pass",`${P.htf.toUpperCase()} ${d1d} · ${P.top.toUpperCase()} ${W.stage} · 空間 ${room.toFixed(1)}×ATR`);

  /* GATE 4 — HPCZ: >= 3 confluences, one must be 25/50 EMA */
  const respects = Math.abs(px-I.e25) < Math.abs(px-I.e50) ? 25 : 50;
  const emaLvl = respects===25 ? I.e25 : I.e50;
  const conf = [];
  if (Math.abs(px-emaLvl)/I.atr < 1.1) conf.push(`${respects} EMA`);
  const structLvl = dir==="UP" ? st.lastL : st.lastH;
  if (structLvl && Math.abs(px-structLvl.p)/I.atr < 1.6) conf.push(dir==="UP"?"HL structure":"LH structure");
  // horizontal S/R: level touched >= 2x historically
  const touches = I.bars.slice(-120).filter(b => Math.abs(b.l-px)/I.atr<0.5 || Math.abs(b.h-px)/I.atr<0.5).length;
  if (touches >= 2) conf.push(`S/R ×${touches}`);
  // fib retracement of the last leg
  if (st.lastH && st.lastL){
    const hi = Math.max(st.lastH.p, st.lastL.p), lo = Math.min(st.lastH.p, st.lastL.p);
    [0.382,0.5,0.618].forEach(f => {
      const lvl = dir==="UP" ? hi-(hi-lo)*f : lo+(hi-lo)*f;
      if (Math.abs(px-lvl)/I.atr < 0.55 && !conf.some(c=>c.startsWith("Fib"))) conf.push(`Fib ${(f*100).toFixed(1)}%`);
    });
  }
  // Being in a pullback is precondition C1 in the manual, NOT one of the six
  // confluence factors. Counting it inflated the tally while genuine setups
  // with 3 real factors were still rejected for lacking the EMA.
  const pulling = dir==="UP" ? px < I.e25*1.004 : px > I.e25*0.996;

  const hasEma = conf.some(c=>c.includes("EMA"));
  if (conf.length < CFG.minConfluence || !hasEma || !pulling){
    push(4,"wait",`${conf.length}/${CFG.minConfluence} confluence${conf.length?" · "+conf.join(", "):""}`);
    skipRest(5); return { gates:g, ok:false, stop:4, dir, side };
  }
  push(4,"pass",`${conf.length} confluences · ${conf.join(", ")}`);

  /* GATE 5 — risk: SL >= 2xATR, RR >= 1:2, risk <= 1% */
  const entry = px;
  const anchor = dir==="UP" ? (structLvl ? structLvl.p : px-2*I.atr)
                            : (structLvl ? structLvl.p : px+2*I.atr);
  let sl = dir==="UP" ? anchor - 0.2*I.atr : anchor + 0.2*I.atr;
  let slDist = Math.abs(entry-sl);
  if (slDist < CFG.slAtrMult*I.atr){
    // per SOP: never shrink the stop to manufacture RR — widen to 2xATR and re-test RR
    slDist = CFG.slAtrMult*I.atr;
    sl = dir==="UP" ? entry-slDist : entry+slDist;
  }
  const tp = keyLvl;
  const reward = Math.abs(tp-entry);
  const rr = reward/slDist;
  if (rr < CFG.minRR){
    push(5,"fail",`RR 1:${rr.toFixed(2)} < 1:${CFG.minRR} → skip (never shrink SL)`);
    skipRest(6); return { gates:g, ok:false, stop:5, dir, side };
  }
  const sizing = sizePosition(sizingEquity(), slDist, entry, asset);
  if (!sizing.ok){
    push(5,"fail",sizing.why);
    skipRest(6); return { gates:g, ok:false, stop:5, dir, side };
  }
  push(5,"pass",`RR 1:${rr.toFixed(2)} · SL ${(slDist/I.atr).toFixed(2)}×ATR · ${sizing.qty.toFixed(4)} ${asset}`);

  /* GATE 6 — confirmation candle on the last CLOSED 4H bar */
  const cc = confirmCandle(I.bars, dir);
  if (!cc){
    push(6,"wait","awaiting rejection candle (pin / engulfing)");
    push(7,"skip","—");
    return { gates:g, ok:false, stop:6, dir, side, plan:{entry,sl,tp,rr,slDist,...sizing} };
  }
  push(6,"pass",`${cc.kind} · wick ${(cc.wick*100).toFixed(0)}% of range`);

  /* GATE 7 — execution */
  push(7,"pass","all 18 preconditions true → armed");
  return { gates:g, ok:true, stop:7, dir, side, conf, tf:P.label,
           plan:{ entry, sl, tp, rr, slDist, ...sizing }, trigger:cc.kind };
}

/* ---------------------------------------------------------------- *
 * 7. STRATEGY 2 — 雙均線交易系統 (Dual Moving Average)
 * ---------------------------------------------------------------- */
function evalDualMA(asset, tfKey){
  const m = S.mkt[asset], I = m.tf[tfKey], px = m.last, C = S.strat.dualma;
  const label = TF[tfKey].label;
  const checks = [];
  const xr = m.cross[tfKey];
  const age = xr ? I.barIdx - xr.at : Infinity;
  const fresh = !!xr && age <= CROSS_WINDOW;
  const dir = fresh ? xr.dir : (I.fast > I.slow ? "UP" : "DOWN");
  const side = dir === "UP" ? "LONG" : "SHORT";
  const goldenCross = fresh && xr.dir === "UP";
  const deathCross  = fresh && xr.dir === "DOWN";
  const crossed = fresh;

  checks.push({ k:`EMA${C.fast}/EMA${C.slow}`, ok:crossed,
    v: goldenCross ? `GOLDEN CROSS 金叉 (${age}b)` : deathCross ? `DEATH CROSS 死叉 (${age}b)`
       : `no fresh cross · spread ${(((I.fast-I.slow)/I.slow)*100).toFixed(2)}%` });

  const volOk = I.vol >= I.volAvg * C.volMult;
  checks.push({ k:"Volume filter", ok:volOk,
    v:`${(I.vol/I.volAvg).toFixed(2)}× avg (need ≥${C.volMult.toFixed(1)}×)` });

  const adxOk = I.adx >= C.adxMin;
  checks.push({ k:"ADX(14)", ok:adxOk, v:`${I.adx.toFixed(1)} (need ≥${C.adxMin})` });

  // Trend agreement on the signal's own timeframe. Swing structure is the
  // primary read; when 15m is too noisy to print a clean HH/HL run, fall back to
  // the regime call so the filter still answers "is this frame trending my way"
  // rather than rejecting everything outright.
  const trendDir = I.st.dir !== "NONE" ? I.st.dir : I.stage.dir;
  const trendSrc = I.st.dir !== "NONE" ? "structure" : "regime";
  const structOk = !C.useTrendFilter || trendDir === dir;
  checks.push({ k:"Structure filter", ok:structOk,
    v: C.useTrendFilter ? `${label} ${trendDir} (${trendSrc}) vs ${dir}` : "disabled" });

  const ok = crossed && volOk && adxOk && structOk;
  if (!ok) return { checks, ok:false, side, dir, tf:label, tfKey };

  // Stop and target are sized off *this* timeframe's ATR — a 15m signal must
  // not inherit a 4H stop, or its risk would be several multiples of 1%.
  const entry = px;
  const slDist = CFG.slAtrMult * I.atr;
  const sl = dir==="UP" ? entry-slDist : entry+slDist;
  const tp = dir==="UP" ? entry + slDist*CFG.minRR : entry - slDist*CFG.minRR;
  const sizing = sizePosition(sizingEquity(), slDist, entry, asset);
  if (!sizing.ok) { checks.push({k:"Sizing", ok:false, v:sizing.why});
                    return { checks, ok:false, side, dir, tf:label, tfKey }; }
  checks.push({ k:"Sizing", ok:true, v:`${sizing.qty.toFixed(4)} ${asset} · margin ${usd(sizing.margin)}` });

  return { checks, ok:true, side, dir, tf:label, tfKey,
           plan:{ entry, sl, tp, rr:CFG.minRR, slDist, ...sizing },
           trigger: `${goldenCross ? "GOLDEN CROSS" : "DEATH CROSS"} ${label}` };
}

/* ---------------------------------------------------------------- *
 * 7b. STRATEGY 3 — MACD + EMA120 趨勢過濾
 * ------------------------------------------------------------------
 * EMA120 is the regime gate: longs only above it, shorts only below.
 * MACD supplies the timing (signal-line cross on a closed bar), with the
 * histogram required to agree so we skip crosses that happen while
 * momentum is still running the other way.
 *
 * The long-MA filter is the one piece here with real evidence behind it —
 * time-series momentum (Moskowitz, Ooi & Pedersen 2012, JFE) documents
 * that filtering by a slow trend measure improves risk-adjusted return
 * across asset classes. MACD timing itself has no comparable support; it
 * is a smoothing of the same price series, not an independent signal.
 * ---------------------------------------------------------------- */
function macd(closes, fast=12, slow=26, sig=9){
  const ef = ema(closes, fast), es = ema(closes, slow);
  const line = closes.map((_,i) => ef[i] - es[i]);
  const signal = ema(line, sig);
  const hist = line.map((v,i) => v - signal[i]);
  return { line, signal, hist };
}

function evalMacd(asset, tfKey){
  const m = S.mkt[asset], I = m.tf[tfKey], px = m.last, C = S.strat.macd;
  if (!I || !I.bars || I.bars.length < C.trendLen + 40) return { checks:[], ok:false, tfKey };
  const label = TF[tfKey].label;
  const closes = I.bars.map(b => b.c);
  const n = closes.length;
  const trend = ema(closes, C.trendLen);
  const M = macd(closes, C.fast, C.slow, C.signal);

  // read the last CLOSED bar, not the one still forming
  const i = n - 2;
  if (i < 2) return { checks:[], ok:false, tfKey };
  const checks = [];

  const above = closes[i] > trend[i];
  const dir = above ? "UP" : "DOWN";
  const side = above ? "LONG" : "SHORT";
  const dist = Math.abs(closes[i] - trend[i]) / I.atr;
  checks.push({ k:`EMA${C.trendLen} 趨勢`, ok:true,
    v:`價格在 EMA${C.trendLen} ${above?"之上 → 只做多":"之下 → 只做空"}(距離 ${dist.toFixed(1)}×ATR)` });

  const crossUp = M.line[i-1] <= M.signal[i-1] && M.line[i] > M.signal[i];
  const crossDn = M.line[i-1] >= M.signal[i-1] && M.line[i] < M.signal[i];
  const crossed = above ? crossUp : crossDn;
  checks.push({ k:"MACD 訊號線交叉", ok:crossed,
    v: crossed ? (above?"黃金交叉":"死亡交叉")
       : `無交叉(DIF ${M.line[i]>M.signal[i]?">":"<"} DEA)` });

  const histOk = above ? M.hist[i] > 0 && M.hist[i] > M.hist[i-1]
                       : M.hist[i] < 0 && M.hist[i] < M.hist[i-1];
  checks.push({ k:"柱狀圖動能", ok:histOk,
    v:`${M.hist[i].toFixed(4)}(${histOk?"同向增強":"未同向"})` });

  // Reject entries stretched far from the trend line — buying an extended
  // move is where a 2xATR stop gets hit by ordinary mean reversion.
  const notExtended = dist <= C.maxDist;
  checks.push({ k:"乖離過濾", ok:notExtended,
    v:`${dist.toFixed(1)}×ATR(上限 ${C.maxDist}）` });

  const ok = crossed && histOk && notExtended;
  if (!ok) return { checks, ok:false, side, dir, tf:label, tfKey };

  const entry = px;
  const slDist = CFG.slAtrMult * I.atr;
  const sl = above ? entry - slDist : entry + slDist;
  const tp = above ? entry + slDist*C.rr : entry - slDist*C.rr;
  const sizing = sizePosition(sizingEquity(), slDist, entry, asset);
  if (!sizing.ok){ checks.push({k:"倉位",ok:false,v:sizing.why});
                   return { checks, ok:false, side, dir, tf:label, tfKey }; }
  checks.push({ k:"倉位", ok:true, v:`${sizing.qty.toFixed(4)} ${asset} · 保證金 ${usd(sizing.margin)}` });

  return { checks, ok:true, side, dir, tf:label, tfKey,
           plan:{ entry, sl, tp, rr:C.rr, slDist, ...sizing },
           trigger:`MACD ${above?"金叉":"死叉"} + EMA${C.trendLen} ${label}` };
}

/* ---------------------------------------------------------------- *
 * 7c. STRATEGY 4 — 海龜交易法 TURTLE
 * ------------------------------------------------------------------
 * Dennis/Eckhardt's published rules, as documented by Curtis Faith.
 *   System 1: enter on a 20-period breakout, exit on a 10-period reversal
 *   System 2: enter on a 55-period breakout, exit on a 20-period reversal
 *   N = ATR(20); the stop is 2N; size is risk_pct of equity per N.
 * System 1 skips a breakout if the PREVIOUS System-1 signal would have won —
 * that filter is what stops it front-running every failed breakout, and
 * dropping it changes the system's character entirely, so it is kept.
 *
 * This is a low win-rate, high reward:risk design by construction: it takes
 * many small losses on failed breakouts to catch the few large trends.
 * ---------------------------------------------------------------- */
function donchian(bars, n, upto){
  const end = upto === undefined ? bars.length - 1 : upto;
  const from = Math.max(0, end - n);
  let hi = -Infinity, lo = Infinity;
  for (let i = from; i < end; i++){          // excludes the current bar
    if (bars[i].h > hi) hi = bars[i].h;
    if (bars[i].l < lo) lo = bars[i].l;
  }
  return { hi, lo };
}

/** Would the previous System-1 breakout have been a winner? */
function turtleLastWasWin(bars, C){
  const n = bars.length;
  let entry = null, dir = 0;
  for (let i = C.entryN + 5; i < n - 1; i++){
    const d = donchian(bars, C.entryN, i);
    const x = donchian(bars, C.exitN, i);
    if (entry === null){
      if (bars[i].c > d.hi){ entry = bars[i].c; dir = 1; }
      else if (bars[i].c < d.lo){ entry = bars[i].c; dir = -1; }
    } else {
      const out = dir > 0 ? bars[i].c < x.lo : bars[i].c > x.hi;
      if (out){
        const win = dir > 0 ? bars[i].c > entry : bars[i].c < entry;
        entry = null;
        if (i > n - 200) return win;         // only the most recent matters
      }
    }
  }
  return false;
}

function evalTurtle(asset, tfKey){
  const m = S.mkt[asset], I = m.tf[tfKey], C = S.strat.turtle;
  if (!I || !I.bars || I.bars.length < C.entryN + 60) return { checks:[], ok:false, tfKey };
  const bars = I.bars, n = bars.length, label = TF[tfKey].label;
  const i = n - 2;                            // last CLOSED bar
  const checks = [];

  const sysN  = C.system === 2 ? C.entryN2 : C.entryN;
  const exitN = C.system === 2 ? C.exitN2  : C.exitN;
  const d = donchian(bars, sysN, i);
  const px = bars[i].c;

  const up = px > d.hi, dn = px < d.lo;
  checks.push({ k:`${sysN} 期唐奇安通道`, ok:(up||dn),
    v: up ? `突破上軌 ${fmt(d.hi,2)} → 做多`
       : dn ? `跌破下軌 ${fmt(d.lo,2)} → 做空`
       : `區間內(${fmt(d.lo,2)} ~ ${fmt(d.hi,2)})` });
  if (!up && !dn) return { checks, ok:false, tf:label, tfKey };

  // System 1's losing-filter: skip if the previous signal would have won
  let filterOk = true;
  if (C.system === 1 && C.useLossFilter){
    filterOk = !turtleLastWasWin(bars, { entryN:C.entryN, exitN:C.exitN });
    checks.push({ k:"前次訊號過濾", ok:filterOk,
      v: filterOk ? "前一次突破為虧損 → 可進場" : "前一次突破獲利 → 依規則跳過" });
    if (!filterOk) return { checks, ok:false, tf:label, tfKey };
  }

  const N = atr(bars.slice(0, i+1), C.atrN);   // Turtle "N"
  if (!(N > 0)) return { checks, ok:false, tf:label, tfKey };
  const dir = up ? "UP" : "DOWN";
  const side = up ? "LONG" : "SHORT";
  const entry = m.last;
  const slDist = C.stopN * N;
  const sl = up ? entry - slDist : entry + slDist;
  const x = donchian(bars, exitN, i);
  // Target is the opposite channel; fall back to an N-multiple if it is behind us
  let tp = up ? Math.max(x.hi, entry + slDist*CFG.minRR)
              : Math.min(x.lo, entry - slDist*CFG.minRR);
  const rr = Math.abs(tp - entry) / slDist;
  checks.push({ k:`N = ATR(${C.atrN})`, ok:true,
    v:`${fmt(N,2)} · 停損 ${C.stopN}N = ${fmt(slDist,2)}` });

  const sizing = sizePosition(sizingEquity(), slDist, entry, asset);
  if (!sizing.ok){ checks.push({k:"倉位",ok:false,v:sizing.why});
                   return { checks, ok:false, side, dir, tf:label, tfKey }; }
  checks.push({ k:"倉位", ok:true, v:`${sizing.qty.toFixed(4)} ${asset} · 盈虧比 1:${rr.toFixed(2)}` });

  return { checks, ok:true, side, dir, tf:label, tfKey,
           plan:{ entry, sl, tp, rr, slDist, ...sizing },
           trigger:`海龜 S${C.system} ${sysN}期突破 ${label}` };
}

/* ---------------------------------------------------------------- *
 * 7d. STRATEGY 5 — RSI2 回歸 (15m)
 * ------------------------------------------------------------------
 * Larry Connors' 2-period RSI mean reversion, with his trend filter.
 * Documented rules: only take longs while price is above a long moving
 * average, enter when RSI(2) collapses below ~5, exit when it recovers
 * past ~65. Published equity backtests report win rates around 75-79%
 * (quantifiedstrategies.com), which is why it is here — the user asked
 * for a high-win-rate 15m system.
 *
 * READ THIS BEFORE BELIEVING THE WIN RATE: a high hit-rate necessarily
 * comes with a SMALL average win. This system wins often and
 * loses rarely but badly — published tests show ~34% drawdowns when a trend
 * refuses to mean-revert. High win rate and high reward:risk are opposite
 * ends of the same trade-off; you cannot have both.
 * ---------------------------------------------------------------- */
function rsi(closes, p){
  const n = closes.length;
  if (n < p + 1) return new Array(n).fill(50);
  const out = new Array(n).fill(50);
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++){
    const d = closes[i] - closes[i-1];
    if (d >= 0) g += d; else l -= d;
  }
  g /= p; l /= p;
  out[p] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  for (let i = p+1; i < n; i++){
    const d = closes[i] - closes[i-1];
    g = (g*(p-1) + (d > 0 ? d : 0)) / p;
    l = (l*(p-1) + (d < 0 ? -d : 0)) / p;
    out[i] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  }
  return out;
}

function evalRsi2(asset, tfKey){
  const m = S.mkt[asset], I = m.tf[tfKey], C = S.strat.rsi2;
  if (!I || !I.bars || I.bars.length < C.trendLen + 20) return { checks:[], ok:false, tfKey };
  const bars = I.bars, n = bars.length, label = TF[tfKey].label;
  const closes = bars.map(b => b.c);
  const i = n - 2;                            // last CLOSED bar
  const checks = [];

  const trend = ema(closes, C.trendLen);
  const R = rsi(closes, C.rsiLen);
  const above = closes[i] > trend[i];
  const side = above ? "LONG" : "SHORT";
  const dir  = above ? "UP" : "DOWN";
  checks.push({ k:`EMA${C.trendLen} 趨勢濾網`, ok:true,
    v: above ? "價格在上 → 只做多(逢低買)" : "價格在下 → 只做空(逢高空)" });

  const trig = above ? R[i] <= C.buyBelow : R[i] >= C.sellAbove;
  checks.push({ k:`RSI(${C.rsiLen})`, ok:trig,
    v:`${R[i].toFixed(1)}(需 ${above ? "≤"+C.buyBelow : "≥"+C.sellAbove}）` });
  if (!trig) return { checks, ok:false, side, dir, tf:label, tfKey };

  const a = atr(bars.slice(0, i+1), 14);
  if (!(a > 0)) return { checks, ok:false, side, dir, tf:label, tfKey };

  // Mean reversion targets the average, not a trend extension — so the
  // reward is deliberately modest and the win rate is where the edge lives.
  const entry = m.last;
  const slDist = C.stopAtr * a;
  const sl = above ? entry - slDist : entry + slDist;
  const tp = above ? entry + slDist * C.rr : entry - slDist * C.rr;
  checks.push({ k:"目標", ok:true,
    v:`盈虧比 1:${C.rr}(均值回歸屬低盈虧比、高勝率)` });

  const sizing = sizePosition(sizingEquity(), slDist, entry, asset);
  if (!sizing.ok){ checks.push({k:"倉位",ok:false,v:sizing.why});
                   return { checks, ok:false, side, dir, tf:label, tfKey }; }
  checks.push({ k:"倉位", ok:true, v:`${sizing.qty.toFixed(4)} ${asset}` });

  return { checks, ok:true, side, dir, tf:label, tfKey,
           plan:{ entry, sl, tp, rr:C.rr, slDist, ...sizing },
           trigger:`RSI${C.rsiLen} ${above?"超賣":"超買"} ${label}` };
}

/* ---------------------------------------------------------------- *
 * 7e. STRATEGY 6 — SMC 聰明錢概念 Smart Money Concepts
 * ------------------------------------------------------------------
 * The retail SMC framework, implemented to its usual published definitions:
 *
 *   Liquidity sweep — price pushes beyond a prior swing, triggers the stops
 *     resting there, and REVERSES. A clean break that keeps going is a
 *     breakout, not a sweep, so the close must come back inside.
 *   BOS  — break of structure in the trend direction (continuation).
 *   CHoCH— first break against the trend (possible reversal).
 *   Order block — the last opposing candle before the impulsive move that
 *     broke structure.
 *   FVG  — three-candle imbalance: the gap between candle 1's high and
 *     candle 3's low (bullish), left unfilled by the middle candle.
 *
 * Entry waits for price to retrace into the order block or the FVG, stop sits
 * beyond the sweep extreme (where the idea is wrong), target is the opposite
 * liquidity pool.
 *
 * HONESTY NOTE: unlike the long-MA trend filter, SMC has no peer-reviewed
 * evidence base. It is a narrative layered on support/resistance and order
 * flow, popularised through retail education rather than published research.
 * It is implemented faithfully here so it can be measured — treat the
 * backtest, not the narrative, as the evidence.
 * ---------------------------------------------------------------- */

/** Three-candle imbalance ending at index i. Returns the unfilled gap. */
function findFVG(bars, i, dir){
  if (i < 2) return null;
  const a = bars[i-2], c = bars[i];
  if (dir === "UP" && c.l > a.h)  return { lo:a.h, hi:c.l };   // gap left below
  if (dir === "DOWN" && c.h < a.l) return { lo:c.h, hi:a.l };  // gap left above
  return null;
}

/** Last opposing candle before the impulse that broke structure. */
function findOrderBlock(bars, from, to, dir){
  for (let i = to; i >= Math.max(1, from); i--){
    const b = bars[i];
    const opposing = dir === "UP" ? b.c < b.o : b.c > b.o;
    if (opposing) return { lo: Math.min(b.o, b.c, b.l), hi: Math.max(b.o, b.c, b.h), i };
  }
  return null;
}

function evalSmc(asset, tfKey){
  const m = S.mkt[asset], I = m.tf[tfKey], C = S.strat.smc;
  if (!I || !I.bars || I.bars.length < 80) return { checks:[], ok:false, tfKey };
  const bars = I.bars, n = bars.length, label = TF[tfKey].label;
  const st = I.st;
  const checks = [];

  // --- 1. bias from market structure -------------------------------------
  const dir = st.dir !== "NONE" ? st.dir : I.stage.dir;
  if (dir === "NONE"){
    checks.push({ k:"市場結構", ok:false, v:"無明確結構,不交易" });
    return { checks, ok:false, tf:label, tfKey };
  }
  const side = dir === "UP" ? "LONG" : "SHORT";
  checks.push({ k:"市場結構", ok:true,
    v:`${dir === "UP" ? "上升(找多)" : "下降(找空)"} · ${st.run} 個同向標籤` });

  // --- 2. liquidity sweep: took the stops, then closed back inside --------
  const lookback = Math.min(C.sweepLookback, n - 3);
  const priorLow  = st.lastL ? st.lastL.p : Math.min(...bars.slice(-lookback, -1).map(b=>b.l));
  const priorHigh = st.lastH ? st.lastH.p : Math.max(...bars.slice(-lookback, -1).map(b=>b.h));

  let sweep = null;
  for (let i = n - 2; i >= Math.max(2, n - C.sweepWithin); i--){
    const b = bars[i];
    if (dir === "UP" && b.l < priorLow && b.c > priorLow){
      sweep = { i, level: priorLow, extreme: b.l }; break;
    }
    if (dir === "DOWN" && b.h > priorHigh && b.c < priorHigh){
      sweep = { i, level: priorHigh, extreme: b.h }; break;
    }
  }
  checks.push({ k:"流動性掃蕩", ok:!!sweep,
    v: sweep
      ? `第 ${n-1-sweep.i} 根前掃過 ${fmt(sweep.level,2)} 後收回`
      : `近 ${C.sweepWithin} 根內未見掃蕩後收回(單純突破不算)` });
  if (!sweep) return { checks, ok:false, side, dir, tf:label, tfKey };

  // --- 3. BOS after the sweep: structure actually shifted back ------------
  const after = bars.slice(sweep.i + 1);
  const bos = dir === "UP"
    ? after.some(b => b.c > priorHigh)
    : after.some(b => b.c < priorLow);
  checks.push({ k:"結構突破 BOS", ok:bos,
    v: bos ? `掃蕩後已突破 ${fmt(dir === "UP" ? priorHigh : priorLow, 2)}`
           : "掃蕩後尚未突破結構 — 等待確認" });
  if (!bos) return { checks, ok:false, side, dir, tf:label, tfKey };

  // --- 4. order block / FVG as the entry zone ----------------------------
  const ob = findOrderBlock(bars, sweep.i, n - 2, dir);
  let fvg = null;
  for (let i = sweep.i + 2; i <= n - 2; i++){
    const g = findFVG(bars, i, dir);
    if (g){ fvg = g; break; }
  }
  const zone = ob || (fvg ? { lo:fvg.lo, hi:fvg.hi } : null);
  checks.push({ k:"進場區", ok:!!zone,
    v: ob ? `訂單塊 ${fmt(ob.lo,2)} ~ ${fmt(ob.hi,2)}`
       : fvg ? `價值缺口 ${fmt(fvg.lo,2)} ~ ${fmt(fvg.hi,2)}`
       : "找不到訂單塊或價值缺口" });
  if (!zone) return { checks, ok:false, side, dir, tf:label, tfKey };

  // --- 5. price must have retraced INTO the zone -------------------------
  const px = m.last;
  const pad = (zone.hi - zone.lo) * C.zonePad;
  const inZone = px >= zone.lo - pad && px <= zone.hi + pad;
  checks.push({ k:"回撤到位", ok:inZone,
    v: inZone ? `現價 ${fmt(px,2)} 已進入區間`
              : `現價 ${fmt(px,2)} 尚未回到 ${fmt(zone.lo,2)} ~ ${fmt(zone.hi,2)}` });
  if (!inZone) return { checks, ok:false, side, dir, tf:label, tfKey };

  // --- 6. risk: stop beyond the sweep extreme, target the opposite pool ---
  const a = atr(bars.slice(0, n - 1), 14);
  if (!(a > 0)) return { checks, ok:false, side, dir, tf:label, tfKey };
  const entry = px;
  const invalid = dir === "UP" ? Math.min(sweep.extreme, zone.lo) : Math.max(sweep.extreme, zone.hi);
  let slDist = Math.abs(entry - invalid) + 0.1 * a;
  if (slDist < CFG.slAtrMult * a) slDist = CFG.slAtrMult * a;   // never tighter than the ATR floor
  const sl = dir === "UP" ? entry - slDist : entry + slDist;
  const pool = dir === "UP" ? priorHigh : priorLow;
  let tp = dir === "UP" ? Math.max(pool, entry + slDist * CFG.minRR)
                        : Math.min(pool, entry - slDist * CFG.minRR);
  const rr = Math.abs(tp - entry) / slDist;
  if (rr < CFG.minRR){
    checks.push({ k:"盈虧比", ok:false, v:`1:${rr.toFixed(2)} < 1:${CFG.minRR}` });
    return { checks, ok:false, side, dir, tf:label, tfKey };
  }
  checks.push({ k:"盈虧比", ok:true,
    v:`1:${rr.toFixed(2)} · 停損放在掃蕩低點外 ${fmt(sl,2)}` });

  const sizing = sizePosition(sizingEquity(), slDist, entry, asset);
  if (!sizing.ok){ checks.push({k:"倉位",ok:false,v:sizing.why});
                   return { checks, ok:false, side, dir, tf:label, tfKey }; }
  checks.push({ k:"倉位", ok:true, v:`${sizing.qty.toFixed(4)} ${asset}` });

  return { checks, ok:true, side, dir, tf:label, tfKey,
           plan:{ entry, sl, tp, rr, slDist, ...sizing },
           trigger:`SMC ${ob?"訂單塊":"價值缺口"}回撤 ${label}` };
}

/* ---------------------------------------------------------------- *
 * 8. POSITION SIZING  (GATE 5 / Risk Control Center)
 * ---------------------------------------------------------------- */
/** Volatility targeting.
 *
 *  Scales risk inversely to how volatile the instrument currently is relative
 *  to its own recent norm: quiet regime → up to `volMax`× the base risk, wild
 *  regime → down to `volMin`×. Moreira & Muir (2017, Journal of Finance,
 *  "Volatility-Managed Portfolios") found that reducing exposure after
 *  volatility spikes improved risk-adjusted returns across equity factors;
 *  the mechanism is that volatility is far more forecastable than return, so
 *  cutting size in turbulent periods removes variance without giving up much
 *  expected profit. The cap matters: uncapped inverse-vol sizing loads up
 *  enormously in calm markets, which is exactly when regime breaks start.
 *
 *  Note this scales RISK, not the stop. The stop stays at 2×ATR; what changes
 *  is how many dollars ride on it.
 */
function volScalar(asset){
  const V = CFG.volTarget;
  if (!V.on) return 1;
  const m = S.mkt[asset];
  const I = m && m.tf && (m.tf[PB_TFS[PLAYBOOK_TF].exec] || m.tf.h4 || m.tf.m15);
  if (!I || !I.bars || I.bars.length < V.lookback + 5) return 1;
  const bars = I.bars;
  const atrPct = I.atr / bars[bars.length-1].c;
  // baseline = median ATR% over the lookback, robust to single spikes
  const hist = [];
  for (let i = bars.length - V.lookback; i < bars.length; i++){
    const b = bars[i]; if (!b || !b.c) continue;
    hist.push((b.h - b.l) / b.c);
  }
  if (hist.length < 10) return 1;
  hist.sort((a,b)=>a-b);
  const med = hist[hist.length >> 1];
  if (!(med > 0) || !(atrPct > 0)) return 1;
  return clamp(med / atrPct, V.min, V.max);
}

/** Equity that position size is derived from.
 *
 *  The simulated account starts at $10,000 and grows on paper. Sizing a REAL
 *  order from it asks the exchange for a position the account cannot cover —
 *  a $10k-sized order against a $5 balance. When live orders are armed the
 *  exchange balance is the only number that means anything. */
function sizingEquity(){
  if (S.btMode) return S.acct.equity;
  const real = (typeof realOrderBlocker === "function" && realOrderBlocker() === null)
    ? beEquity() : null;
  return (real !== null && real > 0) ? real : S.acct.equity;
}

/** Exchange minimum order sizes. Below these the venue rejects outright, and
 *  a 1% risk budget on a small balance lands under them very easily. */
const MIN_QTY = { BTC:0.001, ETH:0.01, SOL:0.1, BNB:0.01, XRP:1, ADA:1,
                  DOGE:1, AVAX:0.1, LINK:0.1, DOT:0.1, LTC:0.01, ATOM:0.1 };

function sizePosition(equity, slDist, entry, asset){
  const riskAmt = equity * CFG.riskPct * volScalar(asset);
  const step = CFG.assets[asset].qstep;
  const ideal = riskAmt / slDist;
  // Rounding UP to the lot floor silently breaks the risk rule: on a small
  // balance the smallest tradeable size can risk many times the budget.
  // Round DOWN and let the minimum-size check reject it, rather than quietly
  // turning a 1% trade into a 10% one.
  let qty = Math.floor(ideal / step) * step;
  qty = +qty.toFixed(8);
  const notional = qty * entry;
  const margin = notional / CFG.leverage;
  const usedMargin = S.positions.reduce((s,p)=>s+p.margin,0);
  const util = (usedMargin + margin) / equity;
  if (util > CFG.maxMarginUse)
    return { ok:false, why:`margin util ${(util*100).toFixed(0)}% > ${CFG.maxMarginUse*100}%`, qty, notional, margin, riskAmt, util };
  if (margin > equity)
    return { ok:false, why:"保證金不足", qty, notional, margin, riskAmt, util };
  const minQ = Math.max(MIN_QTY[asset] || 0, step);
  if (qty < minQ){
    // Smallest tradeable size vs the risk budget it would actually consume.
    const realRisk = minQ * slDist;
    const needed = realRisk / CFG.riskPct;
    return { ok:false, qty, notional, margin, riskAmt, util,
             why:`最小下單量 ${minQ} ${asset} 會風險 ${usd(realRisk)},`
               + `超出 ${(CFG.riskPct*100).toFixed(1)}% 預算 ${usd(riskAmt)} —— `
               + `這個標的至少需要 ${usd(needed,0)} 帳戶才做得起來` };
  }
  // Belt and braces: never let rounding push actual risk past the budget.
  const actualRisk = qty * slDist;
  if (actualRisk > riskAmt * 1.05){
    return { ok:false, qty, notional, margin, riskAmt, util,
             why:`四捨五入後風險 ${usd(actualRisk)} 超出預算 ${usd(riskAmt)}` };
  }
  return { ok:true, qty, notional, margin, riskAmt, util, fee: notional*CFG.takerFee };
}

function liqPrice(entry, side){
  const k = 1/CFG.leverage - CFG.maintMarginRate;
  return side === "LONG" ? entry*(1-k) : entry*(1+k);
}

/* ---------------------------------------------------------------- *
 * 9. CIRCUIT BREAKERS
 * ---------------------------------------------------------------- */
function checkBreakers(){
  const eq = S.acct.equity;
  const dPnl = (eq - S.acct.dayAnchor) / S.acct.dayAnchor;
  const wPnl = (eq - S.acct.weekAnchor) / S.acct.weekAnchor;
  const B = S.breaker, was = B.daily || B.weekly || B.streak;

  B.daily  = dPnl <= -CFG.breakers.daily;
  B.weekly = wPnl <= -CFG.breakers.weekly;
  B.streak = B.streakCount >= CFG.breakers.streak;
  if (B.streak && !B.cooldownUntil) B.cooldownUntil = Date.now() + 60_000; // 1 "day" = 60s
  if (B.cooldownUntil && Date.now() > B.cooldownUntil){ B.cooldownUntil = 0; B.streakCount = 0; B.streak = false; }

  const now = B.daily || B.weekly || B.streak;
  if (now && !was){
    const which = B.daily ? `DAILY LOSS ${pct(dPnl)} ≥ 2%`
                : B.weekly ? `WEEKLY LOSS ${pct(wPnl)} ≥ 5%`
                : `${B.streakCount} CONSECUTIVE LOSSES`;
    S.engine = "HALTED";
    log("ERR", `CIRCUIT BREAKER TRIPPED — ${which}. New entries suspended.`);
    toast(`<b>Circuit breaker</b><br>${which} — trading paused.`, "r", 8000);
  }
  if (!now && was && !S.killed){
    S.engine = anyStratOn() && anyExOn() ? "RUNNING" : "IDLE";
    log("INFO","Circuit breakers cleared — engine resumed.");
  }
  return { dPnl, wPnl, halted: now };
}
/** Every strategy the engine can run. Anything that enables or disables
 *  strategies in bulk MUST iterate this — enumerating a subset by hand is how
 *  "stop all strategies" ended up leaving three of them trading. */
const STRAT_KEYS = ["playbook", "dualma", "macd", "turtle", "rsi2", "smc"];
const anyStratOn = () => STRAT_KEYS.some(k => S.strat[k] && S.strat[k].on);
const onStratCount = () => STRAT_KEYS.filter(k => S.strat[k] && S.strat[k].on).length;
const setAllStrats = on => STRAT_KEYS.forEach(k => { if (S.strat[k]) S.strat[k].on = on; });
const anyExOn = () => EXCHANGES.some(e => S.ex[e].on);
const tradingBlocked = () =>
  S.killed || S.breaker.daily || S.breaker.weekly || S.breaker.streak ||
  S.breaker.tradesToday >= CFG.breakers.maxTradesDay || !anyExOn() || !anyStratOn();

/* ---------------------------------------------------------------- *
 * 10. EXECUTION
 * ---------------------------------------------------------------- */
/** Random-walk the measured latency of connected venues so routing reflects
 *  real conditions rather than a fixed winner chosen at connection time. */
function jitterLatency(){
  EXCHANGES.forEach(id => {
    const e = S.ex[id];
    if (!e.on || e.lat === null) return;
    e.lat = clamp(Math.round(e.lat + gauss()*7), 11, 320);
  });
}

function pickExchange(){
  const on = EXCHANGES.filter(e => S.ex[e].on);
  if (!on.length) return null;
  // route to the lower-latency venue
  return on.sort((a,b)=>(S.ex[a].lat||999)-(S.ex[b].lat||999))[0];
}

function openPosition(asset, strat, sig){
  const ex = pickExchange();
  if (!ex) return;
  const p = sig.plan;

  // Sanity gate: SL and TP must straddle entry on the correct sides, or the
  // position would close instantly at the wrong price.
  const okGeom = sig.side === "LONG" ? (p.sl < p.entry && p.tp > p.entry)
                                     : (p.sl > p.entry && p.tp < p.entry);
  if (!okGeom || !isFinite(p.qty) || p.qty <= 0){
    log("ERR", `REJECTED ${sig.side} ${asset} — invalid order geometry `
      + `(entry ${p.entry.toFixed(2)}, SL ${p.sl.toFixed(2)}, TP ${p.tp.toFixed(2)}). Signal discarded.`);
    return;
  }

  // At 20× the liquidation band is only ~4.6% wide. A 2×ATR stop on a slow
  // timeframe can exceed that, which would mean being liquidated before the
  // stop ever fills. The Risk Matrix flags this case — enforce it here too.
  const liq = liqPrice(p.entry, sig.side);
  const liqDist = Math.abs(liq - p.entry);
  if (p.slDist >= liqDist*0.95){
    log("ERR", `REJECTED ${sig.side} ${asset} — 2×ATR stop ${(p.slDist/p.entry*100).toFixed(2)}% `
      + `exceeds the 20× liquidation distance ${(liqDist/p.entry*100).toFixed(2)}%. `
